<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liard · BOM</title>
<link rel="stylesheet" href="ui.css">
<script src="data.js"></script>
<script src="app.js"></script>
<style>
  /* Solo presentación de esta pantalla; todo con tokens. */
  .bm-top { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
  .bm-top .bm-vdesc { color: var(--ink-3); font-size: var(--fs-sm); margin: 0; }
  .bm-saved { margin-left: auto; font: 500 11px/1.4 var(--font-mono); color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; }
  .bm-block { display: flex; gap: var(--sp-3); align-items: center; padding: 10px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); margin-bottom: var(--sp-3); flex-wrap: wrap; }
  .bm-block.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
  .bm-block.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
  .bm-block > .ic { color: var(--warn); } .bm-block.ok > .ic { color: var(--ok); }
  .bm-block ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px 16px; flex-wrap: wrap; flex: 1; font-size: var(--fs-sm); }
  .bm-block li a, .bm-block li button.bm-lnk { color: var(--ink); font-weight: 500; }
  .bm-lnk { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .bm-lnk:focus-visible { box-shadow: var(--focus); }
  .bm-rules { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 8px 14px; margin-bottom: var(--sp-3); border: 1px dashed var(--line-strong); border-radius: var(--r-md); font-size: var(--fs-sm); background: var(--surface-2); }
  .bm-rules strong { font-weight: 600; }
  .bm-stats { display: flex; gap: 6px 22px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--ink-2); margin: 0 0 var(--sp-3); }
  .bm-stats b { font: 600 var(--fs-md)/1 var(--font-mono); color: var(--ink); margin-right: 4px; }
  .bm-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .bm-tools .input { width: 260px; height: 32px; }
  .bm-tools .select { width: auto; height: 32px; }
  .bm-hint { font: 500 11px/1.4 var(--font-mono); color: var(--ink-3); margin-left: auto; }
  .bm-bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: var(--volt-soft); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
  .bm-wrap { max-height: 640px; border-radius: 0 0 var(--r-lg) var(--r-lg); }
  body.bm-full .bm-wrap { max-height: none; }
  .bm-grid { min-width: 1080px; font-size: var(--fs-sm); }
  .bm-grid td { padding: 6px 8px; vertical-align: top; }
  .bm-grid th { padding: 9px 8px; z-index: 3; }
  .bm-grid td[data-c]:focus { outline: none; box-shadow: inset 0 0 0 2px var(--brand); border-radius: 0; }
  .bm-grid td.stick, .bm-grid th.stick { position: sticky; left: 0; background: var(--surface); z-index: 2; }
  .bm-grid th.stick { z-index: 4; background: var(--surface-2); }
  .bm-grid td.stick2, .bm-grid th.stick2 { position: sticky; left: 36px; background: var(--surface); z-index: 2; box-shadow: 1px 0 0 var(--line); }
  .bm-grid th.stick2 { z-index: 4; background: var(--surface-2); }
  .bm-grid tbody tr:hover td.stick, .bm-grid tbody tr:hover td.stick2 { background: var(--surface-2); }
  .bm-grid tr.focus td { background: var(--volt-soft) !important; }
  .bm-grid tr.blocked td.stick { box-shadow: inset 3px 0 0 var(--err); }
  .bm-mat strong { display: block; font-weight: 600; line-height: 1.3; }
  .bm-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
  .bm-sel { height: 28px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r-xs); background: var(--surface); color: var(--ink); font: inherit; font-size: var(--fs-xs); max-width: 100%; }
  .bm-sel:focus { outline: none; border-color: var(--brand); box-shadow: var(--focus); }
  .bm-sel[aria-invalid='true'] { border-color: var(--err); background: var(--err-soft); }
  .bm-attrs { display: flex; flex-wrap: wrap; gap: 4px; }
  .bm-grid td[data-c='spec'] { min-width: 250px; width: 290px; }
  .bm-spec { display: flex; flex-wrap: wrap; gap: 4px; } .bm-spec > .bm-sel { font-weight: 600; width: 100%; }
  .bm-grid td[data-c='marca'] .bm-sel { width: 124px; }
  .bm-grid td[data-c='dib'], .bm-grid td[data-c='comprar'], .bm-grid td[data-c='det'], .bm-grid td[data-c='sel'] { width: 1%; }
  .bm-grid td[data-c='cot'] { width: 150px; } .bm-grid td[data-c='estado'] { width: 120px; }
  .bm-grid th { letter-spacing: .04em; }
  .bm-grid td[data-c='mat'] { width: 190px; min-width: 170px; }
  .bm-sel.bm-opt { border-style: dashed; color: var(--ink-2); }
  .bm-attr { display: inline-flex; flex-direction: column; gap: 1px; }
  .bm-attr > span { font: 500 9.5px/1.2 var(--font-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
  .bm-attr > span i { color: var(--err); font-style: normal; }
  .bm-q { font: 600 var(--fs-sm)/1.3 var(--font-mono); text-align: right; display: block; }
  .bm-q small { display: block; font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-3); white-space: nowrap; }
  .bm-cot { font-size: var(--fs-xs); line-height: 1.4; }
  .bm-cot b { font-family: var(--font-mono); }
  .bm-reason { color: var(--warn); font-size: var(--fs-xs); display: block; }
  .bm-iss { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .bm-iss small { color: var(--err); font-weight: 600; font-size: 10.5px; }
  .bm-grid tr.bm-det > td { background: var(--surface-2); padding: 0; }
  .bm-mini td a { white-space: nowrap; }
  .bm-det-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 22px; padding: 14px 16px 16px 52px; max-width: 1180px; }
  .bm-det-g h4 { font-size: var(--fs-sm); margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
  .bm-det-g section { min-width: 0; }
  .bm-mini { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
  .bm-mini th, .bm-mini td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .bm-mini th { font: 600 10px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .bm-mini .num { text-align: right; }
  .bm-mini tfoot td { font-weight: 600; border-bottom: 0; }
  .bm-inl { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; align-items: flex-start; }
  .bm-inl .field { width: 150px; } .bm-inl .input { height: 30px; }
  .bm-ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-xs); }
  .bm-ul li { display: flex; gap: 6px; align-items: baseline; }
  .bm-cmt { border-left: 2px solid var(--line-strong); padding: 2px 0 2px 8px; margin-bottom: 6px; font-size: var(--fs-xs); }
  .bm-cmt small { color: var(--ink-3); display: block; }
  .bm-foot { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; font-size: var(--fs-xs); color: var(--ink-3); }
  .bm-alt { display: inline-flex; gap: 4px; align-items: center; }
  .bm-radio { display: flex; gap: 12px; font-size: var(--fs-xs); margin-bottom: 8px; }
  .bm-radio label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .bm-boards { display: flex; flex-direction: column; gap: var(--sp-4); }
  .bm-board .card-h { flex-wrap: wrap; }
  .bm-board .card-h h3 { font-size: var(--fs-md); }
  .bm-board .tbl td { padding: 7px 10px; }
  .bm-qa { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: var(--fs-xs); background: var(--surface-2); }
  .bm-sub { font: 500 var(--fs-xs)/1.3 var(--font-mono); color: var(--ink-2); }
  .bm-prop { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; background: var(--surface); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; }
  .bm-prop h4 { font-size: var(--fs-sm); }
  .bm-chg { font: 500 var(--fs-xs)/1.5 var(--font-mono); }
  .bm-chg s { color: var(--ink-3); } .bm-chg b { color: var(--ok); }
  .bm-src { list-style: none; margin: 6px 0 0; padding: 0; font-size: var(--fs-xs); color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
  .bm-src li { display: flex; gap: 6px; align-items: baseline; }
  .bm-src .ic { color: var(--cyan); }
  .bm-prop-a { display: flex; flex-direction: column; gap: 6px; align-items: stretch; justify-content: flex-start; min-width: 118px; }
  .bm-props { display: flex; flex-direction: column; gap: 8px; }
  .bm-grp { margin: var(--sp-4) 0 8px; display: flex; gap: 8px; align-items: baseline; }
  .bm-grp h3 { font-size: var(--fs-md); }
  .bm-dlg-attrs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bm-rl { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .bm-rl li { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: var(--fs-sm); }
  .bm-rl li b { font-family: var(--font-mono); color: var(--ink-3); width: 18px; }
  .bm-rl li span { flex: 1; }
  @media (max-width: 1180px) { .bm-det-g { grid-template-columns: 1fr; padding-left: 16px; } .bm-hint { display: none; } }
</style>
</head>
<body data-role="ENGINEER" data-active="bom" data-title="BOM" data-sub="">
<div id="act"></div>
<div id="page">
  <div id="bm-state"></div>
  <div id="bm-blockers"></div>
  <div class="bm-top"><div id="bm-variants"></div><p class="bm-vdesc" id="bm-vdesc"></p><span class="bm-saved" id="bm-saved" aria-live="polite"></span></div>
  <div id="bm-rules"></div>
  <div id="bm-body"></div>
</div>
<script>
(function () {
  const S = () => L.store.get();
  const pid = L.currentProjectId();
  const estado = L.param('estado');
  const COST = 0.02;
  const pr0 = L.project(pid);
  document.body.dataset.sub = pr0.name + ' · ' + pr0.client;
  if (L.param('full') === '1') document.body.classList.add('bm-full');

  /* Estado de la pantalla (solo interfaz; el dominio vive en L.store). */
  const ui = {
    variant: 'componente',
    mode: estado === 'error' || estado === 'conflicto' ? estado : null,
    pending: null, saveFailed: false, lastSaved: null,
    focus: L.param('linea'), expanded: new Set(L.param('linea') ? [L.param('linea')] : []),
    selected: new Set(), altDraft: {},
    filters: L.pref('bom:filters') || { q: '', bloq: false, sinmarca: false, inferidas: false, faltantes: false, familia: '' },
    sort: L.pref('bom:sort') || { key: null, dir: 1 },
    refused: false,
  };
  const VARIANTS = [
    { id: 'componente', label: 'Por componente', desc: 'Grilla experta: todas las líneas de la obra, edición en la celda.' },
    { id: 'tablero', label: 'Por tablero', desc: 'Recorré tablero por tablero lo que cada uno aporta al BOM.' },
    { id: 'asistida', label: 'Revisión asistida', desc: 'El asistente propone correcciones con sus fuentes; vos confirmás cada una.' },
  ];
  const VCAP = { componente: 'existe', tablero: 'existe', asistida: 'propuesto' };

  /* ───── Lecturas derivadas ───── */
  const rules = () => L.project(pid).brandRules || { preferred: [], blocked: [] };
  const lines = () => estado === 'vacio' ? [] : L.linesOf(pid);
  const allBrands = () => [...new Set(S().catalog.filter(c => c.typeId).map(c => c.brand))].sort();
  const exactBrands = (typeId, attrs) => L.type(typeId) ? [...new Set(L.matches({ typeId, attrs, brand: 'ANY' }).map(c => c.brand))] : [];
  const typeBrands = typeId => [...new Set(S().catalog.filter(c => c.published && c.typeId === typeId).map(c => c.brand))];
  const orderBrands = list => { const pref = rules().preferred; return [...pref.filter(b => list.includes(b)), ...list.filter(b => !pref.includes(b)).sort()]; };
  const short = { MARCA: 'Sin marca', CANTIDAD: 'Cantidad 0', SIN_BASE: 'Sin componente base', MARCA_EXCLUIDA: 'Marca excluida' };
  const blocks = l => L.lineIssues(l).some(i => i.blocks);
  const bestOf = l => L.matches(l).sort((a, b) => a.price - b.price);
  const plansTxt = l => Object.entries(l.perPlan || {}).map(([id, q]) => { const p = L.plan(id); const m = p ? p.multiplier || 1 : 1; return (p ? p.name : id) + ' ' + q + (m > 1 ? '×' + m : ''); }).join(' + ') + (l.extraQty ? ' + extra ' + l.extraQty : '');
  const srcWord = { DETECTOR: 'detectado', RULE: 'inferido', MANUAL: 'manual' };
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const E = L.esc;

  /* ───── Guardado (con los estados de error y conflicto simulados) ───── */
  function save(desc, fn) {
    if (ui.mode === 'conflicto') { conflictDialog(); return false; }
    if (ui.mode === 'error' && !ui.saveFailed) { ui.pending = { desc, fn }; ui.saveFailed = true; render(); return false; }
    if (ui.mode === 'error') { ui.pending = { desc, fn }; render(); return false; }
    fn(); ui.lastSaved = L.now(); render(); return true;
  }
  function conflictDialog() {
    L.dialog({ title: 'Alguien más editó este BOM', body: '<p>Otra persona del equipo guardó cambios en líneas que estás editando (409). No guardamos tu cambio: el BOM queda como lo dejó esa persona. Recargá para ver la versión actual y volvé a hacer tu cambio.</p>',
      actions: [{ label: 'Cerrar' }, { label: 'Recargar el BOM', kind: 'primary', onClick: reloadFresh }] });
  }
  function reloadFresh() { L.setParam('estado', null); location.reload(); }
  function retry() {
    const p = ui.pending; ui.mode = null; ui.saveFailed = false; ui.pending = null; L.setParam('estado', null);
    if (p) { p.fn(); ui.lastSaved = L.now(); L.toast('Cambios guardados', { detail: p.desc }); }
    render();
  }
  if (ui.mode === 'error') {
    // Estado de galería: un cambio concreto que no se pudo guardar.
    const l = L.linesOf(pid).find(x => x.brand == null);
    if (l) { const av = orderBrands(exactBrands(l.typeId, l.attrs)); const b = av.find(x => rules().preferred.includes(x)) || 'ANY';
      ui.pending = { desc: 'Marca ' + L.brandLabel(b) + ' en «' + L.lineLabel(l) + '»', fn: () => L.updateLine(l.id, { brand: b }) }; ui.saveFailed = true; }
  }

  /* ───── Controles reutilizables ───── */
  function brandSelect(l, k, labelTxt) {
    const exact = exactBrands(l.typeId, l.attrs); const base = exact.length ? exact : typeBrands(l.typeId);
    const bl = rules().blocked, pref = rules().preferred;
    const ok = orderBrands(base.filter(b => !bl.includes(b)));
    const prefs = ok.filter(b => pref.includes(b)), rest = ok.filter(b => !pref.includes(b));
    const blockedAv = base.filter(b => bl.includes(b));
    const extra = l.brand && l.brand !== 'ANY' && !base.includes(l.brand) ? [l.brand] : [];
    const opt = (v, t) => `<option value="${E(v)}"${(l.brand == null ? '' : l.brand) === v ? ' selected' : ''}>${E(t)}</option>`;
    return `<select class="bm-sel" data-k="${k}" data-act="brand" data-id="${l.id}" aria-label="${E(labelTxt || 'Marca de ' + L.lineLabel(l))}"${l.brand == null ? ' aria-invalid="true"' : ''}>
      ${opt('', 'Sin decidir')}${opt('ANY', 'Cualquier marca')}
      ${prefs.length ? `<optgroup label="Preferidas de la obra">${prefs.map(b => opt(b, b)).join('')}</optgroup>` : ''}
      ${rest.length ? `<optgroup label="${exact.length ? 'Con catálogo para este material' : 'Venden este componente base'}">${rest.map(b => opt(b, b)).join('')}</optgroup>` : ''}
      ${blockedAv.length ? `<optgroup label="Excluidas por la obra">${blockedAv.map(b => opt(b, b + ' (excluida)')).join('')}</optgroup>` : ''}
      ${extra.length ? `<optgroup label="Sin catálogo">${extra.map(b => opt(b, b)).join('')}</optgroup>` : ''}
    </select>`;
  }
  function typeSelect(cur, k, act, id, label) {
    const ts = S().types; const fams = [...new Set(Object.values(ts).map(t => t.family))];
    return `<select class="bm-sel" data-k="${k}" data-act="${act}" data-id="${id || ''}" aria-label="${E(label)}"${!cur ? ' aria-invalid="true"' : ''}>
      <option value=""${!cur ? ' selected' : ''}>Sin componente base</option>
      ${fams.map(f => `<optgroup label="${E(f)}">${Object.entries(ts).filter(([, t]) => t.family === f).map(([tid, t]) => `<option value="${tid}"${tid === cur ? ' selected' : ''}>${E(t.short)}</option>`).join('')}</optgroup>`).join('')}
    </select>`;
  }
  function attrSelects(typeId, attrs, kp, act, id, who, compact) {
    const t = L.type(typeId); if (!t) return '<span class="muted">—</span>';
    if (compact) return `<div class="bm-attrs">${t.attrs.map(a => { const v = attrs[a.k]; const miss = a.req && (v == null || v === '');
      return `<select class="bm-sel${a.req ? '' : ' bm-opt'}" title="${E(a.label)}${a.req ? ' · esencial' : ' · opcional'}" data-k="${kp}:${a.k}" data-act="${act}" data-id="${id || ''}" data-attr="${a.k}" aria-label="${E(a.label + (a.req ? ' (esencial)' : ' (opcional)') + ' de ' + who)}"${miss ? ' aria-invalid="true"' : ''}>
        <option value="">${a.req ? 'Falta' : E(a.label.split(' ')[0]) + ' —'}</option>${a.values.map(x => `<option value="${E(x)}"${String(v) === String(x) ? ' selected' : ''}>${E(x)}${a.unit ? ' ' + E(a.unit) : ''}</option>`).join('')}</select>`; }).join('')}</div>`;
    return `<div class="bm-attrs">${t.attrs.map(a => { const v = attrs[a.k]; const miss = a.req && (v == null || v === '');
      return `<label class="bm-attr"><span>${E(a.label)}${a.req ? '<i title="Esencial para cotizar"> *</i>' : ''}</span><select class="bm-sel" data-k="${kp}:${a.k}" data-act="${act}" data-id="${id || ''}" data-attr="${a.k}" aria-label="${E(a.label + (a.req ? ' (esencial)' : ' (opcional)') + ' de ' + who)}"${miss ? ' aria-invalid="true"' : ''}>
        <option value="">${a.req ? 'Falta' : '—'}</option>${a.values.map(x => `<option value="${E(x)}"${String(v) === String(x) ? ' selected' : ''}>${E(x)}${a.unit ? ' ' + E(a.unit) : ''}</option>`).join('')}</select></label>`; }).join('')}</div>`;
  }
  const parseVal = (typeId, k, raw) => { if (raw === '') return null; const a = L.type(typeId).attrs.find(x => x.k === k); const hit = a.values.find(x => String(x) === raw); return hit === undefined ? raw : hit; };
  function issuesHtml(l) {
    const is = L.lineIssues(l); if (!is.length) return L.badge('Lista', 'ok', 'check');
    return `<div class="bm-iss">${is.map(i => `<span class="badge ${i.blocks ? 'b-err' : 'b-warn'}" title="${E(i.text)}">${L.icon(i.blocks ? 'alertc' : 'alert', 12)}${E(short[i.code] || i.text)}</span>${i.blocks ? '<small>bloquea la cotización</small>' : ''}`).join('')}</div>`;
  }
  function cotHtml(l) {
    const ms = bestOf(l);
    if (!ms.length) return `<div class="bm-cot"><span class="badge b-muted">Sin coincidencias</span><span class="bm-reason">${E(L.unmatchedReason(l) || '')}</span></div>`;
    const sup = new Set(ms.map(m => m.supplierId)).size;
    return `<div class="bm-cot"><b>${ms.length}</b> en catálogo · ${sup} dist.<br>desde <b>${L.ars(ms[0].price)}</b><br>${L.priceTag('referencia')}${L.isStale(ms[0]) ? '<br><span class="bm-reason">vigencia vencida</span>' : ''}</div>`;
  }
  function tagsHtml(l) {
    const nc = L.commentsOf('line:' + l.id).length;
    return `${L.srcTag(l.src)}${l.readingStatus && l.readingStatus !== 'READ' ? L.badge(l.readingStatus === 'PENDING' ? 'Lectura pendiente' : 'Lectura fallida', l.readingStatus === 'PENDING' ? 'info' : 'err') : ''}${l.alt ? `<span class="badge b-cyan bm-alt" title="Alternativa permitida: ${E(altText(l.alt))}">${L.icon('split', 11)}alt: ${E(altShort(l.alt, l))}</span>` : ''}${nc ? `<span class="badge b-muted" title="${nc} comentario${nc > 1 ? 's' : ''}">${L.icon('message', 11)}${nc}</span>` : ''}`;
  }
  const altText = a => (L.type(a.typeId) ? L.type(a.typeId).short + ' ' + L.attrText(a.typeId, a.attrs || {}) : '') + ' · ' + L.brandLabel(a.brand) + (a.note ? ' · ' + a.note : '');
  const altShort = (a, l) => a.typeId === l.typeId && JSON.stringify(a.attrs) === JSON.stringify(l.attrs) ? L.brandLabel(a.brand) : L.type(a.typeId).short + ' ' + L.brandLabel(a.brand);

  /* ───── Encabezado: estados, bloqueos, reglas ───── */
  function renderState() {
    const h = document.getElementById('bm-state');
    if (ui.mode === 'error' && ui.saveFailed) {

  /* ───── Variante a: Por componente ───── */
  function filtered() {
    const f = ui.filters; const q = (f.q || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    let ls = lines().filter(l => {
      if (f.bloq && !blocks(l)) return false;
      if (f.sinmarca && l.brand != null) return false;
      if (f.inferidas && l.src !== 'RULE') return false;
      if (f.faltantes && !L.unmatchedReason(l)) return false;
      if (f.familia && (!L.type(l.typeId) || L.type(l.typeId).family !== f.familia)) return false;
      if (q) { const hay = (L.lineLabel(l) + ' ' + L.brandLabel(l.brand) + ' ' + (l.gama || '') + ' ' + (l.note || '')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); if (!hay.includes(q)) return false; }
      return true;
    });
    const k = ui.sort.key, d = ui.sort.dir;
    const val = { material: l => L.lineLabel(l), base: l => L.type(l.typeId) ? L.type(l.typeId).short : '', marca: l => L.brandLabel(l.brand), dib: l => L.qtyDrawn(l), comprar: l => L.qty(l), cot: l => L.matches(l).length, estado: l => (blocks(l) ? 0 : L.lineIssues(l).length ? 1 : 2) };
    if (k && val[k]) ls = ls.slice().sort((a, b) => { const x = val[k](a), y = val[k](b); return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'es')) * d; });

    const out = []; const r = rules();
    lines().forEach(l => {
      const lab = L.lineLabel(l);
      L.missingAttrs(l).forEach(a => {
        const src = []; let val = null;
        L.commentsOf('line:' + l.id).forEach(c => { const hit = a.values.slice().sort((x, y) => String(y).length - String(x).length).find(v => new RegExp('(^|[^0-9])' + String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*' + (a.unit || '') + '(?![0-9])', 'i').test(c.text));

        const patch = { attrs: Object.assign({}, l.attrs, { [a.k]: val }) }; const ms = L.matches(Object.assign({}, l, patch)).sort((x, y) => x.price - y.price);

          change: `${E(a.label)}: <s>falta</s> → <b>${E(val)}${a.unit ? ' ' + E(a.unit) : ''}</b>`, sources: src,
          effect: ms.length ? `Con este valor aparecen ${ms.length} coincidencias en catálogo, desde ${L.ars(ms[0].price)} ${L.priceTag('referencia')}` : 'Con este valor sigue sin coincidencias en catálogo.' });

        if (l.brand && r.blocked.includes(l.brand)) src.unshift({ ic: 'alert', t: l.brand + ' está excluida por las reglas de la obra.' });

        out.push({ id: 'brand:' + l.id, group: 'brand', lineId: l.id, title: lab, patch: { brand: b }, desc: 'Marca ' + L.brandLabel(b) + ' en «' + lab + '»',
          change: `Marca: <s>${E(L.brandLabel(l.brand))}</s> → <b>${E(L.brandLabel(b))}</b>`, sources: src, effect: l.brand == null ? 'Deja de bloquear la cotización.' : 'Vuelve a ofrecerse en las solicitudes.' });

          change: `Origen: <s>inferido</s> → <b>confirmado por vos</b> · ${L.qty(l)} u.`, sources: [{ ic: 'workflow', t: l.note || 'Inferido por regla.' }, { ic: 'layers', t: 'Tableros: ' + boards + '.' }],

  function renderAsistida(h) {

      L.toast('Componente base cambiado', { detail: 'Revisá los atributos esenciales: los que no aplican quedaron vacíos.', action: { label: 'Deshacer', onClick: () => L.updateLine(id, prev) } });

    L.dialog({ title: 'Marcas de la obra', body: box, actions: [{ label: 'Cancelar' }, { label: 'Guardar marcas', kind: 'primary', onClick: () => {
      if (save('Marcas de la obra', () => L.store.update(s => { s.projects.find(p => p.id === pid).brandRules = draft; L._log(s, pid, s.session.userId, 'Actualizó las marcas de la obra.'); })))
        L.toast('Marcas de la obra guardadas', { detail: 'Las excluidas dejan de ofrecerse. Lo que ya está guardado en el BOM no cambia.' }); } }] });
  }
  function openAdd() {
    const plans = L.plansOf(pid); const d = { typeId: '', attrs: {}, brand: '', plan: plans.find(p => p.status === 'COMPLETED') ? plans.find(p => p.status === 'COMPLETED').id : '', qty: 1, note: '' };
    const box = document.createElement('div');
    const paint = () => {
      const t = L.type(d.typeId); const probe = { typeId: d.typeId, attrs: d.attrs };
      const brands = t ? orderBrands(exactBrands(d.typeId, d.attrs).length ? exactBrands(d.typeId, d.attrs) : typeBrands(d.typeId)) : [];
      box.innerHTML = `<div class="col" style="gap:12px">
        <div class="field"><label for="n-type">Componente base</label>${typeSelect(d.typeId, 'n-type', 'n-type', '', 'Componente base de la línea nueva').replace('class="bm-sel"', 'class="select" id="n-type"').replace(/ aria-invalid="true"/, '')}</div>
        ${t ? `<div><span class="lbl">Atributos (* esencial para cotizar)</span><div class="bm-dlg-attrs" style="margin-top:6px">${t.attrs.map(a => `<div class="field"><label for="n-a-${a.k}">${E(a.label)}${a.req ? ' *' : ''}</label><select class="select" id="n-a-${a.k}" data-na="${a.k}"><option value="">${a.req ? 'Elegí un valor' : 'Sin especificar'}</option>${a.values.map(v => `<option value="${E(v)}"${String(d.attrs[a.k]) === String(v) ? ' selected' : ''}>${E(v)}${a.unit ? ' ' + E(a.unit) : ''}</option>`).join('')}</select></div>`).join('')}</div>
          ${L.missingAttrs(Object.assign({}, probe)).length ? `<p class="bm-reason" id="n-warn" style="margin-top:6px">${L.icon('alert', 12)} Faltan atributos esenciales (${L.missingAttrs(probe).map(a => a.label.toLowerCase()).join(', ')}): la línea se agrega, pero cotiza sin coincidencias hasta que los completes.</p>` : ''}</div>` : ''}
        <div class="bm-dlg-attrs">
          <div class="field"><label for="n-brand">Marca</label><select class="select" id="n-brand"><option value="">Sin decidir (bloquea la cotización)</option><option value="ANY"${d.brand === 'ANY' ? ' selected' : ''}>Cualquier marca</option>${brands.map(b => `<option value="${E(b)}"${d.brand === b ? ' selected' : ''}>${E(b)}${rules().blocked.includes(b) ? ' (excluida)' : ''}</option>`).join('')}</select></div>
          <div class="field"><label for="n-plan">Tablero</label><select class="select" id="n-plan">${plans.map(p => `<option value="${p.id}"${d.plan === p.id ? ' selected' : ''}>${E(p.name)}${(p.multiplier || 1) > 1 ? ' (×' + p.multiplier + ')' : ''}</option>`).join('')}<option value=""${d.plan === '' ? ' selected' : ''}>Sin tablero · cantidad extra</option></select></div>
          <div class="field"><label for="n-qty">Cantidad</label><input class="input num" id="n-qty" type="number" min="1" step="1" value="${E(d.qty)}"><span class="hint">Por tablero; se multiplica por sus repeticiones.</span></div>
          <div class="field"><label for="n-note">Nota (opcional)</label><input class="input" id="n-note" value="${E(d.note)}" placeholder="Ej.: no está en el plano, lo pide el cliente"></div>
        </div></div>`;
    };
    box.addEventListener('change', e => {
      if (e.target.id === 'n-type') { d.typeId = e.target.value; d.attrs = {}; d.brand = ''; paint(); box.querySelector('#n-type').focus(); return; }
      if (e.target.dataset.na) { d.attrs[e.target.dataset.na] = parseVal(d.typeId, e.target.dataset.na, e.target.value); const id = e.target.id; paint(); box.querySelector('#' + id).focus(); return; }
      if (e.target.id === 'n-brand') d.brand = e.target.value; if (e.target.id === 'n-plan') d.plan = e.target.value;
    });
    box.addEventListener('input', e => { if (e.target.id === 'n-qty') d.qty = e.target.value; if (e.target.id === 'n-note') d.note = e.target.value; });
    paint();
    L.dialog({ title: 'Agregar línea a mano', body: box, actions: [{ label: 'Cancelar' }, { label: 'Agregar línea', kind: 'primary', onClick: () => {
      let bad = false; const ti = box.querySelector('#n-type'), qi = box.querySelector('#n-qty');
      if (!d.typeId) { L.fieldError(ti, 'Elegí el componente base: sin él la línea no se puede cotizar por atributos.'); bad = true; } else L.fieldError(ti, null);
      const q = Number(d.qty); if (!(q > 0) || !Number.isInteger(q)) { L.fieldError(qi, 'La cantidad tiene que ser un número entero mayor a 0.'); bad = true; } else L.fieldError(qi, null);
      if (bad) return false;
      const t = L.type(d.typeId); const attrs = {}; t.attrs.forEach(a => { attrs[a.k] = d.attrs[a.k] == null ? null : d.attrs[a.k]; if (!a.req && attrs[a.k] == null) delete attrs[a.k]; });
      const miss = L.missingAttrs({ typeId: d.typeId, attrs }).length;
      const line = { id: L.uid('b'), projectId: pid, typeId: d.typeId, attrs, perPlan: d.plan ? { [d.plan]: q } : {}, extraQty: d.plan ? 0 : q, brand: d.brand === '' ? null : d.brand, src: 'MANUAL', readingStatus: 'READ', linkStatus: 'MANUAL', note: d.note.trim() };
      const ok = save('Línea nueva «' + L.lineLabel(line) + '»', () => L.store.update(s => { line.updatedAt = L.now(); s.bomLines.push(line); L._log(s, pid, s.session.userId, 'Agregó a mano «' + L.lineLabel(line) + '» al BOM.'); }));
      if (ok) { ui.focus = line.id; ui.expanded.add(line.id); render(); L.toast('Línea agregada', { detail: miss ? 'Faltan atributos esenciales: cotiza sin coincidencias hasta completarlos.' : L.lineLabel(line) }); const r = document.getElementById('row-' + line.id); if (r) r.scrollIntoView({ block: 'center' }); }
    } }] });
  }
  async function del(id) {
    const l = L.line(id); const lab = L.lineLabel(l);
    if (!(await L.confirm('Eliminar línea', '«' + lab + '» (' + L.qty(l) + ' u.) sale del BOM y de las próximas solicitudes. Los símbolos del plano no se borran.', 'Eliminar línea', 'danger'))) return;
    if (save('Eliminar «' + lab + '»', () => { L.updateLine(id, { deleted: true }); L.store.update(s => L._log(s, pid, s.session.userId, 'Eliminó «' + lab + '» del BOM.')); })) {
      ui.expanded.delete(id); ui.selected.delete(id); if (ui.focus === id) { ui.focus = null; L.setParam('linea', null); } render();
      L.toast('Línea eliminada', { detail: lab, action: { label: 'Deshacer', onClick: () => L.updateLine(id, { deleted: false }) } });
    }
  }
  function saveAlt(id) {
    const l = L.line(id); const d = ui.altDraft[id]; const sel = document.querySelector(`[data-k="${id}:alt-brand"]`);
    const alt = d.kind === 'marca' ? { typeId: l.typeId, attrs: Object.assign({}, l.attrs), brand: d.brand, note: d.note.trim() } : { typeId: d.typeId, attrs: Object.assign({}, d.attrs), brand: d.brand, note: d.note.trim() };
    let err = null;
    if (!alt.typeId) err = 'Elegí el componente base de la alternativa.';
    else if (!alt.brand) err = 'Elegí la marca de la alternativa (o «Cualquier marca»).';
    else if (d.kind === 'marca' && (alt.brand === l.brand || l.brand === 'ANY')) err = l.brand === 'ANY' ? 'La línea ya acepta cualquier marca: para una alternativa, elegí otro componente base.' : 'Elegí una marca distinta de la de la línea.';
    else if (d.kind === 'base' && L.missingAttrs(alt).length) err = 'Completá los atributos esenciales de la alternativa: el distribuidor necesita la especificación completa.';
    else if (d.kind === 'base' && alt.typeId === l.typeId && JSON.stringify(alt.attrs) === JSON.stringify(l.attrs) && alt.brand === l.brand) err = 'La alternativa es igual a la línea.';
    if (err) { L.fieldError(sel, err); sel.focus(); return; }
    if (save('Alternativa de «' + L.lineLabel(l) + '»', () => L.updateLine(id, { alt })))
      L.toast('Alternativa guardada', { detail: 'El distribuidor la va a ver en la solicitud como alternativa aceptada.' });
  }
  function runReview() {
    if (estado === 'limite' || !L.aiSpend('Asistente', COST, pid, 'Revisión de BOM')) { ui.refused = true; render(); return; }
    ui.refused = false; render(); L.toast('Revisión lista', { detail: proposals().length + ' sugerencias para revisar · ' + L.usd(COST) });
  }
  function applyProp(id) {
    const p = proposals().find(x => x.id === id); if (!p) return; const l = L.line(p.lineId);
    const patch = Object.assign({}, p.patch, { src: 'MANUAL' }); if (p.patch.attrs) patch.linkStatus = 'MANUAL';
    if (save(p.desc, () => { L.updateLine(l.id, patch); L.store.update(s => L._log(s, pid, s.session.userId, 'Confirmó una sugerencia del asistente: ' + p.desc + '.')); }))
      L.toast('Sugerencia aplicada', { detail: p.desc + '. Quedó como manual.' });
  }

  const page = document.getElementById('page');
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || !(page.contains(b) || document.getElementById('act').contains(b))) return;
    const a = b.dataset.act, id = b.dataset.id;
    if (a === 'retry') retry();
    else if (a === 'dismiss-err') { ui.mode = null; ui.saveFailed = false; ui.pending = null; L.setParam('estado', null); render(); L.toast('Cambio descartado', { kind: 'info', detail: 'El BOM quedó como estaba.' }); }
    else if (a === 'reload') reloadFresh();
    else if (a === 'rules') openRules();
    else if (a === 'add') openAdd();
    else if (a === 'xlsx') exportXlsx();
    else if (a === 'csv') exportCsv();
    else if (a === 'filter-bloq') { ui.filters = Object.assign({}, ui.filters, { bloq: true }); L.pref('bom:filters', ui.filters); if (ui.variant !== 'componente') { document.querySelector('[data-v="componente"]').click(); } else render(); }
    else if (a === 'chip') { ui.filters[b.dataset.f] = !ui.filters[b.dataset.f]; L.pref('bom:filters', ui.filters); render(); }
    else if (a === 'clearf') { ui.filters = { q: '', bloq: false, sinmarca: false, inferidas: false, faltantes: false, familia: '' }; L.pref('bom:filters', ui.filters); render(); }
    else if (a === 'prefs') applyPrefs();
    else if (a === 'bulk') bulkBrand(document.getElementById('bm-qa-sel').value, [...ui.selected]);
    else if (a === 'clearsel') { ui.selected.clear(); render(); }
    else if (a === 'qa') { const pl = L.plan(b.dataset.plan); bulkBrand(document.getElementById('qa-' + pl.id).value, lines().filter(l => (l.perPlan || {})[pl.id] && l.brand == null).map(l => l.id), pl.name); }
    else if (a === 'toggle') { if (ui.expanded.has(id)) ui.expanded.delete(id); else { ui.expanded.add(id); ui.focus = id; L.setParam('linea', id); } render(); }
    else if (a === 'del') del(id);
    else if (a === 'cmt') { const ta = document.querySelector(`[data-k="${id}:cmt"]`); const t = ta.value.trim(); if (!t) { L.fieldError(ta, 'Escribí el comentario antes de enviarlo.'); ta.focus(); return; } L.addComment('line:' + id, pid, t); L.toast('Comentario agregado', { detail: 'Lo ve todo el equipo en esta línea.' }); }
    else if (a === 'alt-save') saveAlt(id);
    else if (a === 'alt-remove') { if (save('Quitar alternativa', () => L.updateLine(id, { alt: null }))) { delete ui.altDraft[id]; render(); L.toast('Alternativa quitada', { detail: 'La solicitud va a pedir solo el material de la línea.' }); } }
    else if (a === 'run') runReview();
    else if (a === 'apply') applyProp(b.dataset.prop);
    else if (a === 'dismiss') { const r = lastRun(); const d = dismissed().concat([b.dataset.prop]); L.pref(dismissedKey, { runAt: r.at, ids: d }); render(); L.toast('Sugerencia descartada', { kind: 'info', detail: 'No cambió nada en el BOM.' }); }
  });
  page.addEventListener('change', e => {
    const t = e.target; const a = t.dataset.act, id = t.dataset.id; if (!a) return;
    if (a === 'brand') setBrand(id, t.value);
    else if (a === 'type') setType(id, t.value);
    else if (a === 'attr') { const l = L.line(id); const attrs = Object.assign({}, l.attrs, { [t.dataset.attr]: parseVal(l.typeId, t.dataset.attr, t.value) }); save(L.type(l.typeId).attrs.find(x => x.k === t.dataset.attr).label + ' de «' + L.lineLabel(l) + '»', () => L.updateLine(id, { attrs, linkStatus: 'MANUAL' })); }
    else if (a === 'extra') { const v = Number(t.value); if (!(v >= 0) || !Number.isInteger(v)) { L.fieldError(t, 'Poné un número entero, 0 o más.'); return; } L.fieldError(t, null); save('Cantidad extra de «' + L.lineLabel(L.line(id)) + '»', () => L.updateLine(id, { extraQty: v })); }
    else if (a === 'gama') save('Gama de «' + L.lineLabel(L.line(id)) + '»', () => L.updateLine(id, { gama: t.value.trim() || null }));
    else if (a === 'sel') { if (t.checked) ui.selected.add(id); else ui.selected.delete(id); render(); }
    else if (a === 'selall') { filtered().forEach(l => t.checked ? ui.selected.add(l.id) : ui.selected.delete(l.id)); render(); }
    else if (a === 'fam') { ui.filters.familia = t.value; L.pref('bom:filters', ui.filters); render(); }
    else if (a === 'alt-kind') { const d = ui.altDraft[id]; const l = L.line(id); d.kind = t.value; if (d.kind === 'base') { d.typeId = d.typeId || l.typeId; } render(); }
    else if (a === 'alt-type') { const d = ui.altDraft[id]; d.typeId = t.value; d.attrs = {}; d.brand = ''; render(); }
    else if (a === 'alt-attr') { const d = ui.altDraft[id]; d.attrs[t.dataset.attr] = parseVal(d.typeId, t.dataset.attr, t.value); render(); }
    else if (a === 'alt-brand') { ui.altDraft[id].brand = t.value; }
  });
  page.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.act === 'q') { ui.filters.q = t.value; L.pref('bom:filters', ui.filters); render(); }
    if (t.dataset.act === 'alt-note') ui.altDraft[t.dataset.id].note = t.value;
  });
  /* Teclado en la grilla: flechas entre celdas; Enter/F2 entra al control; Esc vuelve a la celda. */
  page.addEventListener('keydown', e => {
    const td = e.target.closest && e.target.closest('#bm-grid td[data-c]'); if (!td) return;
    const onCell = e.target === td;
    if (!onCell) {
      if (e.key === 'Escape') { e.preventDefault(); td.focus(); return; }
      const passive = e.target.type === 'checkbox' || e.target.tagName === 'BUTTON' || e.target.tagName === 'A';
      if (!passive) return;
    } else if (e.key === 'Enter' || e.key === 'F2') { const c = td.querySelector('select, input, button, a'); if (c) { e.preventDefault(); c.focus(); } return; }
    const dir = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key]; if (!dir) return;
    e.preventDefault();
    const tr = td.parentElement; const rows = [...tr.parentElement.querySelectorAll('tr[data-row]')]; const cells = [...tr.querySelectorAll('td[data-c]')];
    const r = rows.indexOf(tr) + dir[0]; if (r < 0 || r >= rows.length) return;
    const tc = [...rows[r].querySelectorAll('td[data-c]')]; tc[Math.max(0, Math.min(tc.length - 1, cells.indexOf(td) + dir[1]))].focus();
  });

  /* ───── Exportaciones reales ───── */
  const HEAD = ['Material', 'Componente base', 'Atributos', 'Marca', 'Cantidad dibujada', 'Repeticiones', 'Cantidad a comprar', 'Origen'];
  const consolidated = () => lines().map(l => [L.lineLabel(l), L.type(l.typeId) ? L.type(l.typeId).name : 'Sin componente base', L.attrText(l.typeId, l.attrs), L.brandLabel(l.brand), L.qtyDrawn(l), plansTxt(l), L.qty(l), srcWord[l.src] || l.src]);
  function byBoard() {
    const rows = [['Tablero'].concat(HEAD)];
    L.plansOf(pid).forEach(p => lines().filter(l => (l.perPlan || {})[p.id]).forEach(l => { const q = l.perPlan[p.id], m = p.multiplier || 1; rows.push([p.name, L.lineLabel(l), L.type(l.typeId) ? L.type(l.typeId).name : '', L.attrText(l.typeId, l.attrs), L.brandLabel(l.brand), q, m, q * m, srcWord[l.src] || l.src]); }));
    lines().filter(l => l.extraQty).forEach(l => rows.push(['Cantidad extra', L.lineLabel(l), L.type(l.typeId) ? L.type(l.typeId).name : '', L.attrText(l.typeId, l.attrs), L.brandLabel(l.brand), l.extraQty, 1, l.extraQty, srcWord[l.src] || l.src]));
    return rows;
  }
  function exportXlsx() {
    if (!lines().length) { L.toast('No hay líneas para exportar', { kind: 'info', detail: 'Procesá los planos o agregá una línea a mano.' }); return; }
    L.download('bom-' + slug(L.project(pid).name) + '.xlsx', L.xlsx([{ name: 'BOM consolidado', rows: [HEAD].concat(consolidated()) }, { name: 'Por tablero', rows: byBoard() }]));
    L.toast('XLSX descargado', { detail: 'Hojas «BOM consolidado» y «Por tablero» · ' + lines().length + ' líneas' });
  }
  function exportCsv() {
    if (!lines().length) { L.toast('No hay líneas para exportar', { kind: 'info', detail: 'Procesá los planos o agregá una línea a mano.' }); return; }
    L.download('bom-' + slug(L.project(pid).name) + '.csv', L.csv([HEAD].concat(consolidated())), 'text/csv;charset=utf-8');
    L.toast('CSV descargado', { detail: lines().length + ' líneas · separador «;»' });
  }

  L.ready(() => {
    renderAct();
    L.variants(document.getElementById('bm-variants'), VARIANTS, v => { ui.variant = v; render(); }, 'bom');
    L.store.subscribe(() => render());
    if (ui.focus) { const r = document.getElementById('row-' + ui.focus); if (r) setTimeout(() => r.scrollIntoView({ block: 'center' }), 50); }
    if (ui.variant === 'asistida' && L.param('correr') === '1' && !lastRun() && estado !== 'limite') runReview();
  });
})();
</script>
</body>
</html>
