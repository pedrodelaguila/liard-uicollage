<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Reglas del BOM · liard</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="bom.css">
</head>
<body data-role="ing" data-active="reglas" data-h="h1" data-user="hernan"
      data-crumbs="Empresa|d-pla-automatizaciones.html>Reglas del BOM"
      data-title="Reglas del BOM" data-sub="Accesorios que se derivan de un componente y valores para lo que el plano no dice. Valen para todos los proyectos de Tableros Delta S.R.L.; cada línea que tocan queda marcada «Por regla».">
<div id="act">
  <button class="btn out" id="probar" data-icon="flask-conical">Probar en el Hospital</button>
  <button class="btn pri" id="nueva" data-icon="plus">Nueva regla</button>
</div>
<main id="page"></main>
<script src="icons.js"></script><script src="data.js"></script><script src="bom.js"></script>
<script>
window.MOCK = { init() {
  const page = document.getElementById('page'); const I = (n, c) => L.icon(n, c), esc = L.esc;
  const estado = L.q('estado');
  const ui = { sel: L.q('regla') || 'r2', tab: L.q('tipo') || 'todas' };
  const activa = r => { const o = (BOM.priv().reglas || {})[r.id]; return o == null ? r.activa : o; };
  const aplicada = r => !!(BOM.priv().aplicadas || {})[r.id];

  if (estado === 'vacio') {
    page.innerHTML = `<div class="card"><div class="empty"><div class="e-ico">${I('workflow')}</div><h3>Todavía no hay reglas</h3>
      <p>Una regla hace dos cosas: agrega los accesorios que se derivan de un componente («por cada térmica de 16 A, 6 m de cable de 2,5 mm²») o completa lo que el plano no dice («si falta el poder de corte, 6 kA»). Lo que agrega o completa queda marcado «Por regla», y siempre se puede apagar.</p>
      <div class="row" style="justify-content:center"><button class="btn pri" id="e1">${I('plus')}Crear la primera</button><button class="btn out" id="e2">${I('copy')}Empezar con las 3 más usadas del rubro</button></div></div></div>`;
    document.getElementById('e1').onclick = () => document.getElementById('nueva').click();
    document.getElementById('e2').onclick = () => L.toast('Se agregaron 3 reglas apagadas', { desc: 'Borneras por salida · Riel DIN por fila · Poder de corte faltante. Revisalas antes de activarlas.' });
    bindTop(); return;
  }
  if (estado === 'error') {
    page.innerHTML = `<div class="card"><div class="empty"><div class="e-ico" style="background:#fff1f2;color:var(--rose-600)">${I('triangle-alert')}</div><h3>No pudimos cargar las reglas</h3><p>El BOM sigue funcionando: las reglas activas ya aplicadas quedan como están. Reintentá en un momento.</p><button class="btn out" onclick="location.reload()">${I('refresh-cw')}Reintentar</button></div></div>`;
    bindTop(); return;
  }

  function lista() {
    const rs = BOM.REGLAS.filter(r => ui.tab === 'todas' || r.tipo === ui.tab);
    const n = t => BOM.REGLAS.filter(r => t === 'todas' || r.tipo === t).length;
    return `<div class="card"><div class="tabs" style="padding:0 14px" role="tablist">${[['todas', 'Todas'], ['acc', 'Accesorios'], ['falta', 'Lo que falta']].map(([k, t]) => `<button role="tab" aria-selected="${ui.tab === k}" class="${ui.tab === k ? 'on' : ''}" data-tab-r="${k}">${t}<span class="cnt">${n(k)}</span></button>`).join('')}</div>
      <div>${rs.map(r => { const on = activa(r); const u = BOM.usuario(r.autor);
        return `<div class="rule ${r.id === ui.sel ? 'on' : ''} ${on ? '' : 'off'}" data-r="${r.id}" role="button" tabindex="0" aria-pressed="${r.id === ui.sel}">
          <div class="card-ico" style="width:32px;height:32px;font-size:15px">${I(r.tipo === 'acc' ? 'list-plus' : 'circle-question-mark')}</div>
          <div class="grow"><div class="t">${esc(r.n)}</div><div class="d">${esc(r.cuando.join(' · '))} → ${esc(r.entonces.join(' · '))}</div>
          <div class="row gap8" style="margin-top:6px"><span class="av xs ${u.c || ''}">${esc(u.ini)}</span><span class="d" style="margin:0;white-space:nowrap">${esc(u.n.split(' ')[0])} · ${L.fechaCorta(r.fecha)}</span>${r.sinBase ? '<span class="bdg wa">sin componente base</span>' : ''}${r.valida ? '<span class="bdg pri">pide validación</span>' : ''}<span class="bdg mono ml-auto">${on ? r.usos + ' usos' : 'pausada'}</span></div></div>
          <button class="switch" data-manual="1" data-sw="${r.id}" role="switch" aria-checked="${on}" aria-label="${on ? 'Pausar' : 'Activar'} «${esc(r.n)}»"></button></div>`; }).join('')}</div></div>`;
  }

  function detalle() {
    const r = BOM.REGLAS.find(x => x.id === ui.sel); if (!r) return '';
    const on = activa(r); const imp = r.impacto; const l = imp.linea && BOM.linea(imp.linea);
    const tok = (t, k) => `<span class="tok ${k || ''}">${esc(t)}</span>`;
    let impacto;
    if (r.id === 'r2') {
      const ant = l ? l.comprar : 1120; const nue = imp.comprar; const precio = BOM.mejor(l) ? BOM.mejor(l).precio : l.base;
      impacto = `<div class="imp"><div><b>${L.num(nue)} m</b><span>Cable 2,5 mm² a comprar (hoy ${L.num(ant)} m)</span></div><div><b class="delta ${nue < ant ? 'menos' : 'mas'}">${nue < ant ? '−' : '+'}${L.ars(Math.abs(ant - nue) * precio)}</b><span>Diferencia sin IVA al mejor precio</span></div><div><b>132</b><span>Térmicas 2×16 A que la disparan</span></div></div>
        <div class="note info">${I('arrow-left-right')}<div><b>Reemplaza una inferencia de la IA por una regla tuya</b>Hoy los 1.120 m salen de un largo medio que estimó la IA (${BOM.chipOrg({ org: 'inf' })}). Con la regla, la línea pasa a ${BOM.chipOrg({ org: 'reg' })} y la cantidad es: 320 m acotados en los planos + 132 salidas × 6 m = 1.112 m.</div></div>`;
    } else if (r.sinBase) {
      impacto = `<div class="note warn">${I('box')}<div><b>Agregaría líneas sin componente base</b>${esc(imp.t)} Hasta el Sprint 5 (matching para todos los componentes) se cotizan a mano: nunca con un código inventado.</div></div>`;
    } else impacto = `<div class="note ${l && l.estado === 'blocked' ? 'warn' : 'info'}">${I(l ? 'target' : 'info')}<div><b>${l ? esc(l.mat) + ' · ' + esc(l.spec) : 'En el Hospital Regional Cañuelas'}</b>${esc(imp.t)}${l ? ` <a class="src" href="d-bom-editor.html?linea=${l.id}">${I('arrow-right')}Ver la línea</a>` : ''}</div></div>`;
    return `<div class="card"><div class="card-h"><div class="card-ico">${I('workflow')}</div><div class="grow"><h3>${esc(r.n)}</h3><div class="sub">${r.tipo === 'acc' ? 'Accesorio derivado' : 'Valor para lo que falta'} · versión ${['r2', 'r6'].includes(r.id) ? 1 : 3} · creada por ${esc(BOM.usuario(r.autor).n)} el ${L.fecha(r.fecha)} · <span class="tag-h1">h1</span></div></div>
        <div class="r"><span class="st ${on ? 'ok' : 'gr'}">${I(on ? 'circle-check' : 'circle-pause')}${on ? 'Activa' : 'Pausada'}</span></div></div>
      <div class="card-b col gap16">
        <div class="sent">
          <div class="sent-l"><span class="lbl">Cuando</span><div class="toks">${r.cuando.map((c, i) => tok(c, i === 0 ? 'k' : '')).join('<span class="muted">y</span>')}<button class="tok e" id="addc">${I('plus')}condición</button></div></div>
          <div class="sent-l"><span class="lbl">${r.tipo === 'acc' ? 'Agregá' : 'Entonces'}</span><div class="toks">${r.entonces.map((c, i) => tok(c, i === 0 ? 'k' : '')).join('')}</div></div>
          ${r.cant ? `<div class="sent-l"><span class="lbl">Cantidad</span><div class="toks">${tok(r.cant)}</div></div>` : ''}
          <div class="sent-l"><span class="lbl">Si no alcanza</span><div class="toks">${tok(r.valida ? 'dejar la línea bloqueada y armar la consulta' : 'pedir validación a quien revisa el BOM')}</div></div>
        </div>
        <div class="divider"></div>
        <div class="col gap8"><span class="lbl">Qué cambia en el Hospital Regional Cañuelas · Pabellón B</span>${impacto}</div>
        <div class="row">${r.id === 'r2' || r.id === 'r6' ? (aplicada(r) ? `<span class="st ok">${I('circle-check')}Aplicada al Hospital</span>` : `<button class="btn pri" id="aplicar">${I('play')}${on ? 'Aplicar al Hospital' : 'Activar y aplicar al Hospital'}</button>`) : ''}
          <button class="btn out" id="sw2">${I(on ? 'pause' : 'play')}${on ? 'Pausar' : 'Activar'}</button><button class="btn ghost" id="hist">${I('clock-fading')}Historial</button>
</div>
        <span class="muted" style="font-size:12px">Pausar no borra lo que ya agregó: las líneas quedan y se pueden quitar desde el editor.</span>
      </div></div>
      <div class="note">${I('info')}<div><b>De dónde sale</b>Las entrevistas de discovery: EMEVE deriva cable, terminales y numeradores de cada térmica; Meco quiere «si falta la capacidad de ruptura, usar tal valor; si no alcanza, pedir validación». La regla no reemplaza la revisión: en el editor cada línea dice qué regla la tocó.</div></div>`;
  }

  function render() {
    const act = BOM.REGLAS.filter(activa).length;
    page.innerHTML = `<div class="kpis"><div class="kpi"><b>${BOM.REGLAS.length}</b><span>Reglas</span></div><div class="kpi ok"><b>${act}</b><span>Activas</span></div><div class="kpi pri"><b>${BOM.REGLAS.reduce((a, r) => a + (activa(r) ? r.usos : 0), 0)}</b><span>Líneas que tocaron este mes</span></div><div class="kpi warn"><b>${BOM.REGLAS.filter(r => r.sinBase).length}</b><span>Agregan accesorios sin componente base</span></div></div>
      <div class="rg">${lista()}<div class="col gap16" style="position:sticky;top:16px">${detalle()}</div></div>`;
    L.fixLinks(page);
    const g = id => document.getElementById(id);
    const r = BOM.REGLAS.find(x => x.id === ui.sel);
    g('sw2') && (g('sw2').onclick = () => toggle(r));
    g('aplicar') && (g('aplicar').onclick = () => aplicar(r));
    g('hist') && (g('hist').onclick = () => L.sheet(`<div class="dlg-h"><div class="card-ico">${I('clock-fading')}</div><div class="grow"><h2>Historial de «${esc(r.n)}»</h2><p>Quién la tocó y qué líneas cambió</p></div><button class="btn icon sm ghost" data-x aria-label="Cerrar">${I('x')}</button></div>
      <div class="dlg-b"><div class="timeline">${[['plus', 'pri', 'Versión 1 · creada por ' + BOM.usuario(r.autor).n, L.fecha(r.fecha)]].concat(['r2', 'r6'].includes(r.id) ? [] : [['pencil', '', 'Versión 2 · cambió la cantidad', 'Hernán Rossi · 02/09/2026'], ['pencil', '', 'Versión 3 · sumó «si no alcanza, pedir validación»', 'Hernán Rossi · 15/09/2026']]).concat([ [activa(r) ? 'play' : 'pause', activa(r) ? 'ok' : '', activa(r) ? 'Activa' : 'Pausada', 'hoy']]).concat(r.usos ? [['list-checks', 'ok', r.usos + ' líneas tocadas en 3 proyectos', 'último uso: Torre Alem 1450 · 26/09']] : []).map(([i, c, t, d]) => `<div class="tl"><div class="tl-i ${c}">${I(i)}</div><div><b>${esc(t)}</b><small>${esc(d)}</small></div></div>`).join('')}</div></div>`, { label: 'Historial de la regla' }));
    g('addc') && (g('addc').onclick = () => L.dialog({ title: 'Agregar condición', icon: 'plus', body: `<div class="field"><label for="ca">Atributo</label><select id="ca" class="inp"><option>Curva de disparo</option><option>Poder de corte</option><option>Polos</option></select></div><div class="field"><label for="cv">Es igual a</label><select id="cv" class="inp"><option>C</option><option>B</option><option>D</option></select></div>`, actions: [{ t: 'Cancelar' }, { t: 'Agregar', fn: () => L.toast('Condición agregada', { desc: 'La regla solo aplica a las térmicas que cumplan todas las condiciones.' }) }] }));
  }
  function toggle(r) {
    const on = !activa(r); L.set('x.bom.reglas.' + r.id, on);
    L.toast(on ? 'Regla activa' : 'Regla pausada', { desc: on ? `«${r.n}» se aplica a los próximos BOM que proceses.` : 'Lo que ya agregó queda en los BOM; los nuevos no la usan.' });
  }
  function aplicar(r) {
    const l = BOM.linea(r.impacto.linea);
    L.dialog({ title: 'Aplicar al Hospital Regional Cañuelas', icon: 'workflow', desc: `Cambia 1 línea del BOM. Queda marcada «Por regla» con el nombre de la regla, y se puede deshacer desde el editor.`,
      body: `<div class="note info">${I('arrow-right')}<div><b>${esc(l.mat)} · ${esc(l.spec)}</b>${esc(r.impacto.t)}</div></div>`,
      actions: [{ t: 'Cancelar' }, { t: 'Aplicar', fn: () => {
        L.set('x.bom.reglas.' + r.id, true); L.set('x.bom.aplicadas.' + r.id, true);
        if (r.id === 'r2') BOM.fijarCantidad('l16', r.impacto.comprar, 'Regla «Cable por térmica de 16 A»: 320 m acotados + 132 salidas × 6 m', 'regla', 'hernan');
        if (r.id === 'r6') BOM.fijarAtributo('l11', 'Formato', '96×96 frontal', 'regla', 'hernan');
        L.toast('Regla aplicada', { desc: l.mat + ' quedó «Por regla»', action: 'Ver en el editor', onAction: () => L.go('d-bom-editor.html?linea=' + l.id) });
      } }] });
  }
  page.addEventListener('click', e => {
    const sw = e.target.closest('[data-sw]'); if (sw) { e.stopPropagation(); return toggle(BOM.REGLAS.find(x => x.id === sw.dataset.sw)); }
    const t = e.target.closest('[data-tab-r]'); if (t) { ui.tab = t.dataset.tabR; return render(); }
    const r = e.target.closest('[data-r]'); if (r) { ui.sel = r.dataset.r; render(); const n = document.querySelector(`[data-r="${ui.sel}"]`); n && n.focus(); }
  });
  page.addEventListener('keydown', e => { const r = e.target.closest('[data-r]'); if (r && (e.key === 'Enter' || e.key === ' ') && !e.target.closest('[data-sw]')) { e.preventDefault(); r.click(); } });
  function bindTop() {
    document.getElementById('nueva').onclick = () => L.dialog({ title: 'Nueva regla', icon: 'workflow', desc: 'Se crea pausada: probala en un proyecto antes de activarla.', wide: true,
      body: `<div class="field"><label for="nr-n">Nombre</label><input id="nr-n" class="inp" placeholder="Ej.: Numeradores por salida"></div>
        <div class="grid2"><div class="field"><label for="nr-t">Tipo</label><select id="nr-t" class="inp"><option>Accesorio derivado</option><option>Valor para lo que falta</option></select></div>
        <div class="field"><label for="nr-c">Cuando aparece</label><select id="nr-c" class="inp">${Object.values(BOM.TIPOS).filter(t => !t.s5).map(t => `<option>${esc(t.n)}</option>`).join('')}</select></div></div>
        <div class="field"><label for="nr-e">Agregá / completá</label><input id="nr-e" class="inp" placeholder="Ej.: Numerador de cable, 2 por polo"><span class="help">Si el accesorio no tiene componente base, se cotiza a mano y nunca con un código inventado.</span></div>`,
      actions: [{ t: 'Cancelar' }, { t: 'Crear pausada', fn: ov => { const n = ov.querySelector('#nr-n'); if (!n.value.trim()) { n.classList.add('bad'); n.focus(); return false; } L.toast('Regla creada pausada', { desc: '«' + n.value.trim() + '» · probala en el Hospital antes de activarla' }); } }] });
    document.getElementById('probar').onclick = () => L.dialog({ title: 'Probar las reglas en el Hospital', icon: 'flask-conical', desc: 'Simulación: no cambia el BOM. Muestra qué haría cada regla activa o pausada.',
      body: `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Regla</th><th>Estado</th><th>Qué haría</th></tr></thead><tbody>${BOM.REGLAS.map(r => `<tr><td><b style="font-weight:600">${esc(r.n)}</b></td><td><span class="st ${activa(r) ? 'ok' : 'gr'}">${activa(r) ? 'Activa' : 'Pausada'}</span></td><td style="font-size:12.5px">${esc(r.impacto.t)}</td></tr>`).join('')}</tbody></table></div>`,
      wide: true, actions: [{ t: 'Cerrar' }] });
  }
  bindTop();
  L.on(render); render();
} };
</script>
<script src="app.js"></script>
</body>
</html>
