<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Mis pedidos · liard</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="compras.css">
</head>
<body data-role="ing" data-active="pedidos" data-h="existe" data-user="sofia"
      data-title="Mis pedidos" data-sub="Seguí el estado de cada pedido enviado a los distribuidores, con sus materiales y el detalle de lo adjudicado.">
<div id="act">
  <div class="seg" data-param="vista" data-default="lista"><button data-vista="lista">Pedidos</button><button data-vista="contraoferta">Contraofertas</button><button data-vista="correos">Correos</button></div>
</div>
<main id="page"></main>
<script src="icons.js"></script><script src="data.js"></script><script src="data-prov.js"></script><script src="compras.js"></script>
<script>
window.MOCK = { init() {
  const page = document.getElementById('page'); const esc = L.esc;
  const V = L.q('vista') || 'lista', E = L.q('estado');
  let fEstado = 'ALL', fProy = 'ALL', buscar = '';
  let ocSel = L.q('oc') || (V === 'correos' ? 'OC-2026-031-1' : null);
  let mailSel = null;
  const proyN = id => (L.get('proyectos').find(p => p.id === id) || {}).n || '';
  const ordenes = () => L.get('pedidos').flatMap(p => p.ordenes.map(o => Object.assign({ ped: p }, o)));
  const status = o => { const c = C.contraDe(o.id); return c && c.estado === 'pendiente' && o.status === 'SENT' ? 'COUNTER' : o.status; };
  const ESTADO_LOTE = p => { const s = p.ordenes.map(status); if (p.aprobacion && p.aprobacion.estado === 'pendiente') return 'APPROVAL'; if (s.includes('COUNTER')) return 'COUNTER'; if (s.every(x => x === 'CONFIRMED')) return 'CONFIRMED'; if (s.includes('SENT')) return 'SENT'; if (s.includes('REJECTED')) return 'REJECTED'; return 'EXPIRED'; };
  const OST = Object.assign({ APPROVAL: 'Por aprobar' }, C.OST);

  if (E === 'vacio') {
    page.innerHTML = `<div class="card" style="overflow:hidden"><div class="row" style="padding:40px 44px;gap:24px;align-items:center"><div class="grow"><h2 style="font-size:var(--text-2xl)">Todavía no enviaste ningún pedido</h2><p class="muted" style="margin-top:8px;max-width:640px">Los pedidos se generan al ejecutar una orden desde una cotización: uno por cada distribuidor al que le adjudicaste material. Acá vas a poder seguir su estado y abrir el detalle de lo que pediste.</p></div><a class="btn pri lg pill" href="d-ing-proyectos.html">Ir a mis proyectos${L.icon('arrow-right')}</a></div>
      <div class="grid3" style="padding:0 44px 40px">${[['table-2', '1 · Cotizá', 'Matriz de líneas por distribuidor, con stock, plazo y fecha de cada lista.'], ['send', '2 · Ejecutá la orden', 'Se emite una OC por distribuidor; las de monto alto pasan por dirección.'], ['mail-check', '3 · Seguí las respuestas', 'Confirmaciones, contraofertas y vencimientos, con el hilo de correos de cada OC.']].map(([i, t, d]) => `<div class="card pad col gap8"><div class="card-ico">${L.icon(i)}</div><b>${t}</b><p class="muted" style="font-size:13px">${d}</p></div>`).join('')}</div></div>`;
    L.fixLinks(page); return;
  }

  function kpis() {
    const os = ordenes(); const c = s => os.filter(o => status(o) === s).length;
    const items = [['wa', 'En espera', c('SENT'), 'sin respuesta'], ['vi', 'Contraofertas', c('COUNTER'), 'para revisar'], ['ok', 'Confirmados', c('CONFIRMED'), 'aceptados'], ['er', 'Rechazados', c('REJECTED'), 'no se entregan'], ['gr', 'Vencidos', c('EXPIRED'), 'sin respuesta a tiempo']];
    return `<div class="kpis">${items.map(([t, l, n, d]) => `<div class="kpi"><div class="row gap8"><span class="dot ${t === 'vi' ? 'pr' : t}"></span><span class="lbl">${l}</span></div><div class="row gap8" style="margin-top:4px"><b style="color:${t === 'wa' ? 'var(--amber-600)' : t === 'ok' ? 'var(--emerald-600)' : t === 'er' ? 'var(--rose-600)' : t === 'vi' ? '#6d28d9' : 'var(--foreground)'}">${n}</b><small>${d}</small></div></div>`).join('')}</div>`;
  }

  function lista() {
    const ps = L.get('pedidos').filter(p => (fEstado === 'ALL' || ESTADO_LOTE(p) === fEstado) && (fProy === 'ALL' || p.proyecto === fProy) && (!buscar || (p.id + ' ' + proyN(p.proyecto)).toLowerCase().includes(buscar.toLowerCase())));
    const tot = ps.reduce((s, p) => s + p.ordenes.reduce((a, o) => a + o.total, 0), 0);
    const contras = ordenes().filter(o => status(o) === 'COUNTER');
    const porAprobar = C.aprobaciones().filter(a => a.estado === 'pendiente' && a.tipo === 'pedido');
    return kpis() +
      (contras.length ? `<div class="note ai" style="background:#f5f3ff;border-color:#ddd6fe"><span style="color:#6d28d9">${L.icon('repeat')}</span><div class="grow"><b>${contras.length === 1 ? esc(C.prov(contras[0].prov).n) + ' propone cambios en ' + C.contraDe(contras[0].id).lineas.length + ' líneas' : contras.length + ' contraofertas para revisar'}</b>Aceptá o rechazá cada cambio antes de que venza la respuesta. <span class="tag-h1">propuesta</span></div><a class="btn sm out" href="d-com-pedidos.html?vista=contraoferta">Revisar contraoferta</a></div>` : '') +
      (porAprobar.length ? `<div class="note warn"><span>${L.icon('stamp')}</span><div class="grow"><b>${porAprobar.length} ${porAprobar.length === 1 ? 'pedido espera' : 'pedidos esperan'} la aprobación de dirección</b>Superan ${L.ars(C.TOPE_OC)} por OC: salen cuando Hernán Rossi los apruebe. <span class="tag-h1">propuesta</span></div><a class="btn sm out" href="m-com-aprobar.html">Ver en el teléfono</a></div>` : '') +
      `<div class="card" style="overflow:hidden"><div class="card-h"><h3>Listado de pedidos</h3><span class="bdg pri">${ps.length} PEDIDOS</span><div class="r"><span class="tag-existe">existe</span></div></div>
      <div class="row" style="padding:12px 20px;border-bottom:1px solid var(--border)"><label class="search grow">${L.icon('search')}<input class="inp" id="q" placeholder="Buscar pedido, proyecto o tablero…" aria-label="Buscar pedido, proyecto o tablero" value="${esc(buscar)}"></label>
        <select class="inp" id="fe" style="width:180px" aria-label="Estado"><option value="ALL">Estado: todos</option>${['SENT', 'COUNTER', 'APPROVAL', 'CONFIRMED', 'REJECTED', 'EXPIRED'].map(s => `<option value="${s}" ${fEstado === s ? 'selected' : ''}>${OST[s]}</option>`).join('')}</select>
        <select class="inp" id="fp" style="width:220px" aria-label="Proyecto"><option value="ALL">Proyecto: todos</option>${[...new Set(L.get('pedidos').map(p => p.proyecto))].map(p => `<option value="${p}" ${fProy === p ? 'selected' : ''}>${esc(proyN(p))}</option>`).join('')}</select></div>
      ${ps.length ? `<div class="tbl-wrap" style="border:0;border-radius:0"><table class="tbl" aria-label="Listado de pedidos"><thead><tr><th>Pedido</th><th>Proyecto</th><th>Estado</th><th>Proveedores</th><th>Respuesta</th><th class="r">Total</th></tr></thead><tbody>
      ${ps.map(p => { const e = ESTADO_LOTE(p); const t = p.ordenes.reduce((a, o) => a + o.total, 0); const pend = p.ordenes.filter(o => o.status === 'SENT'); const sem = pend.length ? C.semaforo(pend.sort((a, b) => a.vence < b.vence ? -1 : 1)[0]) : C.semaforo(p.ordenes[0]);
        const cnt = s => p.ordenes.filter(o => status(o) === s).length;
        return `<tr class="click ${p.nuevo ? 'flash' : ''}" data-ped="${p.id}" tabindex="0"><td><b class="mono" style="color:var(--primary);font-size:13px">${esc(p.id)}</b><div class="muted" style="font-size:12px">${L.icon('calendar')} ${L.fecha(p.enviado)}</div></td><td><b style="font-size:13px">${esc(proyN(p.proyecto))}</b><div class="muted" style="font-size:12px">Proyecto completo${p.sinAsignar ? ` · ${p.sinAsignar} sin asignar` : ''}</div></td>
          <td><span class="ost ${e === 'APPROVAL' ? 'SENT' : e}">${OST[e]}</span></td><td><b style="font-size:13px">${p.ordenes.length} ${p.ordenes.length === 1 ? 'proveedor' : 'proveedores'}</b><div class="muted" style="font-size:12px">${[['SENT', 'en espera', 'en espera'], ['COUNTER', 'con contraoferta', 'con contraoferta'], ['CONFIRMED', 'confirmado', 'confirmados'], ['REJECTED', 'rechazado', 'rechazados'], ['EXPIRED', 'vencido', 'vencidos']].filter(([s]) => cnt(s)).map(([s, t1, tn]) => cnt(s) + ' ' + (cnt(s) === 1 ? t1 : tn)).join(' · ')}</div></td>
          <td><span class="c-sem ${sem.c}"><span class="dot"></span>${esc(sem.t)}</span></td><td class="r"><b class="money" style="font-size:13px">${L.ars(t)}</b><div class="muted" style="font-size:12px">${p.lineas} ítems · +IVA</div></td></tr>`; }).join('')}
      </tbody><tfoot><tr><td colspan="5" class="lbl">Total de los pedidos listados</td><td class="r money" style="color:var(--primary);font-size:15px"><b>${L.ars(tot)}</b></td></tr></tfoot></table></div>` : `<div class="empty"><div class="e-ico">${L.icon('search')}</div><h3>Sin resultados</h3><p>No hay pedidos que coincidan con los filtros aplicados.</p></div>`}</div>`;
  }

  function detallePed(id) {
    const p = L.get('pedidos').find(x => x.id === id); if (!p) return;
    const ov = L.sheet(`<div class="dlg-h"><div class="card-ico">${L.icon('shopping-cart')}</div><div class="grow"><h2 class="mono">${esc(p.id)}</h2><p>${esc(proyN(p.proyecto))} · enviado el ${L.fecha(p.enviado)}</p></div><button class="btn icon sm ghost" data-x aria-label="Cerrar">${L.icon('x')}</button></div>
      <div class="dlg-b"><span class="lbl">Qué le pediste a cada proveedor y cómo viene respondiendo</span>
      ${p.ordenes.map(o => { const s = status(o); const sem = C.semaforo(o); const ls = C.lineasOC(o);
        return `<div class="card" style="border-radius:14px"><div class="card-h" style="padding:12px 14px"><span class="av sm ${C.COLOR[o.prov]}">${C.INI[o.prov]}</span><div class="grow"><b style="font-size:13px">${esc(C.prov(o.prov).n)}</b><div class="mono muted" style="font-size:11.5px">${esc(o.id)} · ${o.lineas} ítems</div></div><span class="ost ${s}">${OST[s]}</span></div>
        <div class="card-b col" style="gap:8px;padding:12px 14px"><div class="row" style="justify-content:space-between"><span class="c-sem ${sem.c}"><span class="dot"></span>${esc(sem.t)}${o.vence && o.status === 'SENT' ? ' · límite ' + L.fecha(o.vence) : ''}</span><b class="money">${L.ars(o.total)}</b></div>
        ${o.motivo ? `<div class="note bad"><span>${L.icon('circle-x')}</span><div>${esc(o.motivo)}</div></div>` : ''}
        ${o.retenida ? `<div class="note warn"><span>${L.icon('stamp')}</span><div>Retenida hasta que dirección apruebe el pedido.</div></div>` : ''}
        ${ls ? `<table class="tbl"><tbody>${ls.map(x => `<tr><td style="font-size:12px"><b>${esc(x.l.mat)}</b><div class="muted mono" style="font-size:11px">${esc(x.codigo)} · ${esc(x.l.spec)}</div></td><td class="r mono" style="font-size:12px">${L.num(x.q)}</td><td class="r money" style="font-size:12px">${L.ars(x.sub)}</td></tr>`).join('')}</tbody></table>` : ''}
        <div class="row gap8">${s === 'COUNTER' ? `<a class="btn sm pri" href="d-com-pedidos.html?vista=contraoferta&oc=${o.id}">${L.icon('repeat')}Revisar contraoferta</a>` : ''}<a class="btn sm out" href="d-com-pedidos.html?vista=correos&oc=${o.id}">${L.icon('mail')}Hilo de correos <span class="tag-s5">s5</span></a>${s === 'EXPIRED' || s === 'REJECTED' ? `<button class="btn sm out" data-reenviar="${o.id}">${L.icon('send')}Reenviar a otro</button>` : ''}${s === 'CONFIRMED' ? `<button class="btn sm ghost" data-contacto="${o.prov}">${L.icon('contact')}Contacto</button>` : ''}</div></div></div>`; }).join('')}
      ${p.sinAsignar ? `<div class="note warn"><span>${L.icon('info')}</span><div><b>${p.sinAsignar} líneas sin asignar</b>${p.proyecto === 'p1' ? 'Seccionador NH00, PM5100 y gabinete: sin match en la cotización.' : 'Sin oferta al momento de emitir.'}</div></div>` : ''}</div>`, { label: 'Detalle del pedido' });
    L.fixLinks(ov);
    ov.addEventListener('click', e => {
      const r = e.target.closest('[data-reenviar]'); if (r) { L.toast('Abrimos la cotización con esas líneas sin asignar', { type: 'info' }); setTimeout(() => L.go('d-com-cotizacion.html'), 600); }
      const c = e.target.closest('[data-contacto]'); if (c) L.toast(C.prov(c.dataset.contacto).n, { type: 'info', desc: 'ventas@' + C.prov(c.dataset.contacto).n.toLowerCase().split(' ')[0].normalize('NFD').replace(/[^a-z]/g, '') + '.com.ar · se habilitó al confirmar' });
    });
  }

  // ---------- Contraofertas ----------
  function contraofertas() {
    const os = ordenes().filter(o => C.contraDe(o.id));
    if (!os.length) return kpis() + `<div class="card"><div class="empty"><div class="e-ico">${L.icon('repeat')}</div><h3>No hay contraofertas</h3><p>Cuando un distribuidor proponga otro precio, plazo o un equivalente, lo revisás acá línea por línea.</p></div></div>`;
    const o = os.find(x => x.id === ocSel) || os[0]; ocSel = o.id;
    const ct = C.contraDe(o.id); const dec = L.get('x.compras.dec.' + o.id) || {};
    const ls = C.lineasOC(o) || [];
    const sem = C.semaforo(o);
    const totalAntes = ct.totalAntes || o.total;
    const delta = (ct.total != null ? ct.total : totalAntes) - totalAntes;
    const CAMB = { precio: ['Precio', 'tag'], plazo: ['Plazo', 'clock'], equivalente: ['Equivalente', 'replace'], parcial: ['Entrega parcial', 'split'] };
    const camb = x => x.sinStock ? ['Sin stock', 'ban'] : (CAMB[x.cambio] || ['Cambio', 'repeat']);
    const resuelta = ct.estado !== 'pendiente';
    return kpis() + `<div class="c-ord"><div class="col" style="gap:10px"><span class="lbl">Con contraoferta</span>${os.map(x => { const c = C.contraDe(x.id); return `<button class="c-oc ${x.id === o.id ? 'on' : ''}" data-oc="${x.id}"><span class="row" style="justify-content:space-between;width:100%"><b class="mono" style="font-size:13px">${esc(x.id)}</b><span class="ost ${c.estado === 'pendiente' ? 'COUNTER' : c.estado === 'aceptada' ? 'CONFIRMED' : 'REJECTED'}">${c.estado === 'pendiente' ? 'Para revisar' : c.estado === 'aceptada' ? 'Aceptada' : 'Rechazada'}</span></span><span style="font-size:13px">${esc(C.prov(x.prov).n)}</span><span class="muted" style="font-size:12px">${c.lineas.length} cambios · ${esc(proyN(x.ped.proyecto))}</span></button>`; }).join('')}
      <div class="note"><span>${L.icon('info')}</span><div style="font-size:12px">Hoy en dev el distribuidor solo acepta o rechaza el pedido entero. La contraoferta por línea la pidieron 3 de 4 empresas en discovery. <span class="tag-h1">propuesta</span></div></div></div>
      <div class="card" style="overflow:hidden"><div class="card-h"><span class="av ${C.COLOR[o.prov]}">${C.INI[o.prov]}</span><div class="grow"><h3>${esc(C.prov(o.prov).n)} · <span class="mono">${esc(o.id)}</span></h3><div class="sub">Recibida ${L.fecha(C.recibida(ct).slice(0, 10))} ${C.hora(C.recibida(ct))}${ct.semilla ? ' · ejemplo' : ''} · ${esc(proyN(o.ped.proyecto))}</div></div><div class="r"><span class="c-sem ${sem.c}"><span class="dot"></span>${esc(sem.t)}</span></div></div>
        <div class="card-b col" style="gap:14px">
        ${ct.lineas.map((x, i) => { const l = C.linea(x.linea); const lx = ls.find(y => y.l.id === x.linea); const dsv = ct.decision || dec; const d = resuelta ? (ct.estado === 'aceptada' ? 'ok' : (dsv[i] || 'no')) : dec[i];
          return `<div style="border:1px solid var(--border);border-radius:14px;padding:14px" class="col gap8"><div class="row"><span class="st vi" style="height:22px;font-size:11.5px">${L.icon(camb(x)[1])}${camb(x)[0]}</span><div class="grow"><b style="font-size:13px">${esc(l.mat)}</b> <span class="muted mono" style="font-size:12px">${esc(l.spec)} × ${lx ? lx.q : l.comprar}</span></div>
            ${resuelta ? `<span class="st ${d === 'ok' ? 'ok' : 'er'}" style="height:22px;font-size:11.5px">${d === 'ok' ? 'Aceptado' : 'Rechazado'}</span>` : `<div class="c-dec" role="group" aria-label="Decisión sobre ${esc(l.mat)}"><button class="btn sm out ${d === 'ok' ? 'sel-ok' : ''}" data-dec="${i}" data-v="ok" aria-pressed="${d === 'ok'}">${L.icon('check')}Aceptar</button><button class="btn sm out ${d === 'no' ? 'sel-no' : ''}" data-dec="${i}" data-v="no" aria-pressed="${d === 'no'}">${L.icon('x')}Rechazar</button></div>`}</div>
            <div class="c-cmp"><div class="a">${esc(x.antes)}</div>${L.icon('arrow-right')}<div class="b">${esc(x.despues)}</div></div>
            ${x.nota ? `<div class="muted" style="font-size:12.5px">${L.icon('message-square')} ${esc(x.nota)}</div>` : ''}
            ${x.cambio === 'equivalente' ? `<div class="note warn"><span>${L.icon('triangle-alert')}</span><div style="font-size:12px"><b>Cambia la marca de un interruptor de caja moldeada</b>Si el TGBT es un diseño verificado por Schneider (IEC 61439), cambiar el aparato le pasa la verificación de diseño al tablerista. Consultalo con ingeniería.</div></div>` : ''}
            ${x.cambio === 'plazo' && (x.linea === 'l05' || x.linea === 'l06') ? `<div class="note warn"><span>${L.icon('calendar-clock')}</span><div style="font-size:12px">${esc(x.despues)}: el TGBT se arma desde el 06/10. <a class="src" href="d-tal-taller.html">ver plan del taller</a></div></div>` : ''}</div>`; }).join('')}
        <div class="row wrap" style="justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)"><div><span class="lbl">Impacto si aceptás todo</span><div class="money ${delta < 0 ? 'down' : delta > 0 ? 'up' : ''}" style="font-weight:700;font-size:14px">${delta < 0 ? '− ' : delta > 0 ? '+ ' : ''}${L.ars(Math.abs(delta))} · la OC queda en ${L.ars(totalAntes + delta)} +IVA</div></div>
          ${resuelta ? `<span class="st ${ct.estado === 'aceptada' ? 'ok' : 'er'}">${ct.estado === 'aceptada' ? 'Respondiste: aceptada' : 'Respondiste: con cambios rechazados'}</span>` : `<div class="row gap8"><button class="btn out" id="todo-ok">Aceptar todo</button><button class="btn pri" id="responder" ${ct.lineas.every((x, i) => dec[i]) ? '' : 'disabled'}>${L.icon('send')}Enviar respuesta</button></div>`}</div>
        </div></div></div>`;
  }

  function responder(acceptAll) {
    const pth = C.ordenPath(ocSel); const ct = JSON.parse(JSON.stringify(C.contraDe(ocSel)));
    const dec = acceptAll ? Object.fromEntries(ct.lineas.map((x, i) => [i, 'ok'])) : (L.get('x.compras.dec.' + ocSel) || {});
    const todas = ct.lineas.every((x, i) => dec[i] === 'ok');
    // Contrato con el área D: solo se escribe .contra.estado (y la decisión por línea); el total de la OC no se toca.
    ct.estado = todas ? 'aceptada' : 'rechazada'; ct.decidida = C.HOY + 'T' + new Date().toTimeString().slice(0, 5); ct.decision = dec;
    delete ct.semilla;
    L.update(s => {
      s.pedidos[pth.k].ordenes[pth.j].contra = ct;
      s.avisos.unshift({ id: 'c-contra-' + ocSel, t: `Respondiste la contraoferta de ${C.prov(pth.oc.prov).n}`, d: todas ? 'Aceptaste los cambios: falta que confirme el pedido' : 'Rechazaste parte de los cambios', i: 'repeat', tipo: 'vi', cuando: 'recién', href: 'd-com-pedidos.html?vista=contraoferta' });
    });
    L.set('x.compras.dec.' + ocSel, dec);
    L.toast(todas ? 'Contraoferta aceptada' : 'Respuesta enviada', { desc: `${C.prov(pth.oc.prov).n} recibe un correo con tu decisión por línea.`, action: 'Ver el correo', onAction: () => L.go('d-com-pedidos.html?vista=correos&oc=' + ocSel) });
  }

  // ---------- Correos (s5) ----------
  function correos() {
    const os = ordenes(); const o = os.find(x => x.id === ocSel) || os[0]; ocSel = o.id;
    const hilo = C.hilo(o.id); const m = hilo.find(x => x.k === mailSel) || hilo.filter(x => !x.futuro).slice(-1)[0] || hilo[0]; mailSel = m.k;
    const pr = C.prov(o.prov);
    return `<div class="note info"><span>${L.icon('mail')}</span><div class="grow"><b>Cada OC tiene su hilo de correos, de los dos lados</b>Lo que liard le mandó al distribuidor, lo que él respondió y las copias para vos, en orden. <span class="tag-s5">Sprint 5 · planificado</span></div></div>
      <div class="c-ord" style="grid-template-columns:300px 360px minmax(0,1fr)"><div class="col" style="gap:8px"><span class="lbl">Órdenes</span>${os.slice(0, 8).map(x => `<button class="c-oc ${x.id === o.id ? 'on' : ''}" data-oc="${x.id}"><span class="row" style="justify-content:space-between;width:100%"><b class="mono" style="font-size:12.5px">${esc(x.id)}</b><span class="ost ${status(x)}">${OST[status(x)]}</span></span><span style="font-size:12.5px">${esc(C.prov(x.prov).n)}</span><span class="muted" style="font-size:11.5px">${C.hilo(x.id).filter(y => !y.futuro).length} correos</span></button>`).join('')}</div>
      <div class="card"><div class="card-h"><div class="grow"><h3>Hilo de ${esc(o.id)}</h3><div class="sub">${esc(pr.n)} · ${hilo.length} correos</div></div></div><div class="card-b"><div class="timeline">
        ${hilo.map(x => `<div class="tl lado-${x.lado} ${x.futuro ? 'fut' : ''} ${x.k === m.k ? 'on' : ''}"><div class="tl-i">${L.icon(x.i)}</div><button class="lk" data-mail="${x.k}"><b>${esc(x.t)}</b><small>${L.fechaCorta(x.cuando.slice(0, 10))} ${C.hora(x.cuando)} · ${x.lado === 'ing' ? 'a vos' : x.de === 'liard' ? 'a ' + esc(pr.n) : 'de ' + esc(pr.n)}${x.futuro ? ' · programado' : ''}</small></button></div>`).join('')}
      </div><div class="row gap8" style="margin-top:4px"><span class="row gap4" style="font-size:11.5px"><span class="dot pr"></span>A tu empresa</span><span class="row gap4" style="font-size:11.5px"><span class="dot" style="background:#6d28d9"></span>Al distribuidor</span></div></div></div>
      <div>${mailHTML(m, o)}</div></div>`;
  }
  function mailHTML(m, o) {
    const pr = C.prov(o.prov); const ls = C.lineasOC(o);
    const para = m.lado === 'ing' ? 'sofia@tablerosdelta.com.ar' : (m.de === 'liard' ? `ventas@${m.mail}.com.ar` : 'pedidos@liard.com.ar');
    const de = m.de === 'liard' ? 'liard <avisos@liard.com.ar>' : `${pr.n} <ventas@${m.mail}.com.ar>`;
    const cuerpo = {
      nuevo: `<p>Hola, equipo de ${esc(pr.n)}:</p><p><b>Tableros Delta S.R.L.</b> te envió el pedido <b>${esc(o.id)}</b> con ${o.lineas} líneas por <b>${L.ars(o.total)} +IVA</b>. Respondé antes del <b>${L.fecha(o.vence || C.sumaDias(o.ped.enviado, 2))}</b>.</p>${ls ? `<table><tbody>${ls.slice(0, 4).map(x => `<tr><td>${esc(x.codigo)}</td><td>${esc(x.l.mat)} ${esc(x.l.spec)}</td><td style="text-align:right">${L.num(x.q)}</td></tr>`).join('')}${ls.length > 4 ? `<tr><td colspan="3" style="color:var(--muted-foreground)">y ${ls.length - 4} líneas más</td></tr>` : ''}</tbody></table>` : ''}<p>Los datos de contacto del comprador se habilitan cuando confirmás.</p>`,
      copia: `<p>Hola, Sofía:</p><p>Enviaste <b>${esc(o.id)}</b> a ${esc(pr.n)} por <b>${L.ars(o.total)} +IVA</b>. Te avisamos por acá cuando responda.</p>`,
      contraoferta: `<p>${esc(pr.n)} propuso cambios en el pedido ${esc(o.id)}${(C.contraDe(o.id) || {}).total ? ' · nuevo total ' + L.ars(C.contraDe(o.id).total) + ' +IVA' : ''}:</p><ul style="margin:0;padding-left:18px">${(C.contraDe(o.id) || { lineas: [] }).lineas.map(x => `<li><b>${esc(C.linea(x.linea).mat)}</b>: ${esc(x.antes)} → ${esc(x.despues)}</li>`).join('')}</ul>`,
      'aviso-contra': `<p>Hola, Sofía:</p><p><b>${esc(pr.n)}</b> propone cambios en ${(C.contraDe(o.id) || { lineas: [] }).lineas.length} cambios en ${esc(o.id)}. Revisalos antes de que venza la respuesta.</p>`,
      decision: `<p>Tableros Delta respondió tu contraoferta en ${esc(o.id)}.</p><p>${(C.contraDe(o.id) || {}).estado === 'aceptada' ? 'Aceptó todos los cambios: ya podés confirmar el pedido.' : 'Aceptó parte de los cambios. Revisá el detalle por línea.'}</p>`,
      confirmado: `<p>${esc(pr.n)} confirmó precio, stock y plazo de <b>${esc(o.id)}</b> por ${L.ars(o.total)} +IVA.</p>`,
      contacto: `<p>Ya podés ver el contacto de Tableros Delta S.R.L. para coordinar la entrega de ${esc(o.id)}.</p>`,
      rechazado: `<p>${esc(pr.n)} rechazó <b>${esc(o.id)}</b>.</p><p>Motivo: ${esc(o.motivo || 'sin motivo')}</p>`,
      vencido: `<p>${esc(o.id)} venció sin respuesta de ${esc(pr.n)}. Podés reenviar las líneas a otro distribuidor desde la cotización.</p>`,
      recordatorio: `<p>Hola, equipo de ${esc(pr.n)}:</p><p>El pedido <b>${esc(o.id)}</b> vence mañana. Si no respondés, Tableros Delta puede pedírselo a otro distribuidor.</p>`,
    }[m.k] || '';
    const cta = { nuevo: 'Ver el pedido', contraoferta: 'Revisar la contraoferta', 'aviso-contra': 'Revisar la contraoferta', recordatorio: 'Responder ahora', confirmado: 'Ver el pedido', rechazado: 'Ver el pedido', vencido: 'Reenviar las líneas', copia: 'Ver el pedido', decision: 'Ver el pedido', contacto: 'Ver el contacto' }[m.k];
    return `<div class="c-mail" aria-label="Vista previa del correo"><div class="mh"><span>De</span><span>${esc(de)}</span><span>Para</span><span>${esc(para)}</span><span>Asunto</span><b>${esc(m.t)}</b><span>Fecha</span><span>${L.fecha(m.cuando.slice(0, 10))} ${C.hora(m.cuando)}${m.futuro ? ' · programado' : ''}</span></div>
      <div class="mb"><span class="brand">${L.LOGO_LOCKUP.replace('<svg', '<svg class="logo"')}</span>${cuerpo}<a class="btn pri sm cta" href="${m.lado === 'prov' ? 'd-com-correo.html?oc=' + o.id + '&mail=' + m.k : 'd-com-pedidos.html?vista=' + (m.k.includes('contra') ? 'contraoferta' : 'lista')}">${esc(cta)}</a><div class="foot">Recibís este correo porque tu empresa usa liard para pedidos de material eléctrico. Configurá qué avisos te llegan en Automatizaciones.</div></div></div>
      ${m.lado === 'prov' ? `<a class="btn ghost sm" href="d-com-correo.html?oc=${o.id}&mail=${m.k}" style="margin-top:8px">${L.icon('inbox')}Verlo como lo recibe el distribuidor</a>` : ''}`;
  }

  function render() {
    page.innerHTML = V === 'contraoferta' ? contraofertas() : V === 'correos' ? correos() : lista();
    L.fixLinks(page);
  }

  page.addEventListener('click', e => {
    const tr = e.target.closest('[data-ped]'); if (tr) return detallePed(tr.dataset.ped);
    const oc = e.target.closest('[data-oc]'); if (oc) { ocSel = oc.dataset.oc; mailSel = null; return render(); }
    const mm = e.target.closest('[data-mail]'); if (mm) { mailSel = mm.dataset.mail; return render(); }
    const d = e.target.closest('[data-dec]');
    if (d) { const k = 'x.compras.dec.' + ocSel; const cur = Object.assign({}, L.get(k) || {}); cur[d.dataset.dec] = cur[d.dataset.dec] === d.dataset.v ? undefined : d.dataset.v; L.set(k, cur); return; }
    if (e.target.closest('#todo-ok')) return responder(true);
    if (e.target.closest('#responder')) return responder(false);
  });
  page.addEventListener('keydown', e => { const tr = e.target.closest('[data-ped]'); if (tr && e.key === 'Enter') detallePed(tr.dataset.ped); });
  page.addEventListener('change', e => { if (e.target.id === 'fe') { fEstado = e.target.value; render(); } if (e.target.id === 'fp') { fProy = e.target.value; render(); } });
  page.addEventListener('input', e => { if (e.target.id === 'q') { buscar = e.target.value; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(buscar.length, buscar.length); } });

  render(); L.on(render);
  const pq = L.q('ped'); if (pq && V === 'lista') setTimeout(() => detallePed(pq), 50);
} };
</script>
<script src="app.js"></script>
</body>
</html>
