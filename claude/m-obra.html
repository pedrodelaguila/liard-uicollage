<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>liard · Obra</title><link rel="stylesheet" href="ui.css"><script src="data.js"></script><script src="app.js"></script>
<style>
  .hero { padding: 14px; margin-bottom: 14px; }
  .hero h2 { font-size: 19px; color: #fff; line-height: 1.25; }
  .hero p { margin: 4px 0 10px; color: var(--stage-ink-2); font-size: var(--fs-sm); }
  .hero .bar { display: flex; gap: 3px; height: 12px; padding: 2px; border-radius: 5px; background: var(--stage-2); }
  .hero .bar i { flex: 1; border-radius: 3px; background: var(--stage-3); } .hero .bar .s-COMPLETED { background: #5fd08f; } .hero .bar .s-PROCESSING { background: var(--cyan); } .hero .bar .s-ERROR { background: #ff8b80; } .hero .bar .s-STALE { background: var(--volt); }
  .hero .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .hero .facts b { display: block; font: 600 20px/1.1 var(--font-display); color: #fff; } .hero .facts small { color: var(--stage-ink-2); font-size: 11.5px; }
  .m-sec { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; } .m-sec h3 { font-size: var(--fs-md); } .m-sec .spacer { flex: 1; }
  .pl { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .pl:last-child { border-bottom: 0; }
  .pl .row { flex-wrap: nowrap; } .pl strong { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .pl small { color: var(--ink-3); display: block; overflow-wrap: anywhere; }
  .pl .err { color: var(--err); font-size: 12.5px; }
  .pl .btn { height: 40px; }
  .prog .meter { height: 8px; } .prog .meter > i { transition: width 900ms linear; }
  .prog .meter.run > i { background: linear-gradient(90deg, var(--brand), var(--cyan)); }
  .prog .meter.queued > i { width: 100% !important; background: repeating-linear-gradient(135deg, var(--line-strong) 0 6px, var(--surface-3) 6px 12px); }
  .prog small { font: 500 11.5px var(--font-mono); margin-top: 4px; }
  .blk { list-style: none; margin: 0; padding: 0; } .blk li { display: flex; gap: 10px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .blk li:last-child { border-bottom: 0; } .blk li .ic { color: var(--err); } .blk li.ok .ic { color: var(--ok); }
  .sticky-cta { margin: 0 0 4px; }
  .sticky-cta .btn { width: 100%; height: 48px; font-size: 15px; }
  .demo-sw { margin-top: 14px; display: flex; padding: 10px 12px; border: 1px dashed var(--warn); border-radius: var(--r-md); background: var(--warn-soft); }
  @media (prefers-reduced-motion: reduce) { .prog .meter > i { transition: none; } }
</style>
</head>
<body class="m" data-role="ENGINEER" data-active="obra" data-title="Obra" data-sub="">
<div id="page"><div id="root"></div></div>
<script>
(function () {
  const esc = L.esc; const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
  const pid = L.currentProjectId(); const pr = L.project(pid);
  document.body.dataset.title = pr.name; document.body.dataset.sub = (pr.client || 'Sin cliente') + ' · ' + (pr.city || 'Sin ciudad');
  const PROC = ['PENDING', 'ERROR', 'STALE'];
  const queued = p => p.status === 'PROCESSING' && p.job && Date.now() < p.job.startedAt;
  const failOn = () => !!L.pref('obras:falla');
  function detectCost() { const m = B.TODAY.slice(0, 7); const d = L.store.get().ai.ledger.filter(e => e.kind === 'Detección' && e.at.slice(0, 7) === m); return d.length ? d.reduce((a, e) => a + e.usd, 0) / d.length : 0; }
  const unOf = id => L.store.get().unidentified.filter(u => u.planId === id && u.status === 'PENDIENTE').length;
  function prog(p) {
    if (p.status !== 'PROCESSING') return '';
    if (queued(p)) return `<div class="prog" data-prog="${p.id}"><div class="meter queued" role="progressbar" aria-label="Progreso de ${esc(p.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="En cola"><i></i></div><small data-t>En cola · arranca en ${Math.ceil((p.job.startedAt - Date.now()) / 1000)} s</small></div>`;
    const pc = Math.round(L.jobProgress(p) * 100); return `<div class="prog" data-prog="${p.id}"><div class="meter run" role="progressbar" aria-label="Progreso de ${esc(p.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pc}"><i style="width:${pc}%"></i></div><small data-t>${pc} % · quedan ${Math.max(0, Math.ceil((p.job.startedAt + p.job.durationMs - Date.now()) / 1000))} s</small></div>`;
  }
  let sig = '';
  const sigOf = () => L.plansOf(pid).map(p => p.id + p.status + (queued(p) ? 'q' : '') + (p.multiplier || 1) + unOf(p.id)).join('|') + L.linesOf(pid).map(l => l.brand).join() + failOn();
  function render() {
    const ps = L.plansOf(pid); const st = L.projectStage(pid); const bl = L.blockers(pid); const todo = ps.filter(p => PROC.includes(p.status)); const busy = ps.some(p => p.status === 'PROCESSING');
    const est = detectCost() * todo.length; const can = L.aiCan(est);
    document.getElementById('root').innerHTML = `<section class="stage hero" aria-label="Estado de la obra"><div class="row">${L.badge(st.label, st.tone)}${L.cap('propuesto')}</div><h2 style="margin-top:8px">${esc(pr.name)}</h2><p>${esc(pr.client || 'Sin cliente')} · ${esc(pr.city || 'Sin ciudad')}</p>
        ${ps.length ? `<div class="bar" aria-hidden="true">${ps.map(x => `<i class="s-${x.status}"></i>`).join('')}</div>` : ''}
        <div class="facts"><div><b>${ps.filter(x => x.status === 'COMPLETED').length}/${ps.length}</b><small>planos listos</small></div><div><b>${L.boardsOf(pid)}</b><small>tableros a armar</small></div><div><b>${L.linesOf(pid).length}</b><small>líneas del BOM</small></div></div></section>
      ${todo.length && !busy ? `<div class="sticky-cta"><button class="btn btn-primary" data-procall ${can ? '' : 'disabled'}>${L.icon('play', 16)}Procesar ${plural(todo.length, 'plano', 'planos')} · ${L.usd(est)} IA</button>${can ? '' : '<small class="muted">Llegaste al límite de IA del mes.</small>'}</div>` : ''}
      <div class="m-sec"><h3>Planos</h3>${L.cap('existe')}<span class="spacer"></span><small class="muted">${plural(ps.length, 'plano', 'planos')}</small></div>
      <div class="card">${ps.length ? ps.map(p => { const u = unOf(p.id); return `<div class="pl" data-plan="${p.id}"><div class="row"><strong>${esc(p.name)}${(p.multiplier || 1) > 1 ? ` <span class="mono muted" style="font-size:12px">×${p.multiplier}</span>` : ''}</strong>${L.badge(L.planStatusLabel[p.status], L.planStatusTone[p.status])}</div>
          <small>${esc(p.file)}${u ? ` · <span style="color:var(--err);font-weight:600">${plural(u, 'símbolo sin identificar', 'símbolos sin identificar')}</span>` : ''}</small>${prog(p)}
          ${p.status === 'ERROR' ? `<span class="err">${esc(p.lastError || 'La detección falló.')}</span>` : ''}
          ${queued(p) ? `<button class="btn btn-secondary" data-cancel="${p.id}">${L.icon('x', 15)}Cancelar (todavía no empezó)</button>` : PROC.includes(p.status) && !busy ? `<button class="btn btn-secondary" data-proc="${p.id}">${L.icon(p.status === 'ERROR' ? 'refresh' : 'play', 15)}${p.status === 'ERROR' ? 'Reintentar' : 'Procesar'}</button>` : ''}</div>`; }).join('')
        : L.empty({ icon: 'layers', title: 'La obra no tiene planos', text: 'Subilos desde la computadora: un archivo por tablero (.dxf o .pdf).' })}</div>
      <div class="m-sec"><h3>Qué bloquea la cotización</h3>${L.cap('existe')}</div>
      <div class="card"><ul class="blk">${bl.length ? bl.map(b => `<li>${L.icon('alertc', 17)}<span>${esc(b.text)}</span></li>`).join('') : `<li class="ok">${L.icon('check', 17)}<span>Nada: ya se puede pedir cotización.</span></li>`}</ul></div>
      <label class="switch demo-sw"><input type="checkbox" data-fail ${failOn() ? 'checked' : ''}>Simular falla de detección <small class="muted">(demo)</small></label>
`;
    sig = sigOf();
  }
  function tick() {
    if (sigOf() !== sig) return render();
    document.querySelectorAll('[data-prog]').forEach(el => { const p = L.plan(el.dataset.prog); if (!p || !p.job) return; if (queued(p)) { el.querySelector('[data-t]').textContent = 'En cola · arranca en ' + Math.ceil((p.job.startedAt - Date.now()) / 1000) + ' s'; return; }
      const pc = Math.round(L.jobProgress(p) * 100); el.querySelector('i').style.width = pc + '%'; el.querySelector('[role=progressbar]').setAttribute('aria-valuenow', pc); el.querySelector('[data-t]').textContent = pc + ' % · quedan ' + Math.max(0, Math.ceil((p.job.startedAt + p.job.durationMs - Date.now()) / 1000)) + ' s'; });
  }
  function go(ids) { ids = ids.filter(id => PROC.includes(L.plan(id).status)); if (!ids.length) return; if (!L.aiCan(detectCost() * ids.length)) { L.toast('No se mandó a procesar', { kind: 'err', detail: 'Llegaste al límite de IA del mes.' }); return; } L.processPlans(ids, { fail: failOn() }); L.toast(ids.length === 1 ? 'Mandaste a procesar ' + L.plan(ids[0]).name : 'Mandaste a procesar ' + ids.length + ' planos', { kind: 'info' }); }
  document.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.proc) go([b.dataset.proc]);
    else if ('procall' in b.dataset) go(L.plansOf(pid).filter(p => PROC.includes(p.status)).map(p => p.id));
    else if (b.dataset.cancel) { const n = L.plan(b.dataset.cancel).name; const ok = L.cancelProcessing(b.dataset.cancel); L.toast(ok ? n + ' volvió a Pendiente' : 'Ya empezó: no se puede cancelar', { kind: ok ? 'ok' : 'warn' }); } });
  document.addEventListener('change', e => { if ('fail' in e.target.dataset) { L.pref('obras:falla', e.target.checked); render(); } });
  L.ready(() => { render(); L.store.subscribe(render); setInterval(tick, 1000); });
})();
</script></body></html>
