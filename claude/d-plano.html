<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liard · Revisión en plano</title>
<link rel="stylesheet" href="ui.css">
<script src="data.js"></script>
<script src="app.js"></script>
<style>
/* Revisión en plano · estilos locales (solo tokens) */
.pv-head { display: flex; align-items: flex-end; gap: 16px; padding: 14px 16px; flex-wrap: wrap; }
.pv-plansel { width: 280px; }
.pv-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-bottom: 6px; font-size: var(--fs-sm); color: var(--ink-2); }
.pv-kpis { display: flex; gap: 20px; margin-left: auto; padding-bottom: 2px; }
.pv-kpis div { display: flex; flex-direction: column; } .pv-kpis strong { font: 600 var(--fs-xl)/1.1 var(--font-display); }
.pv-kpis small { color: var(--ink-3); }
.pv-bar { display: flex; align-items: center; gap: 12px; margin: 14px 0; flex-wrap: wrap; }
.pv-blk { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; font-size: var(--fs-sm); }
.pv-blk a { color: var(--ink-2); }
.pv-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.pv-filters .lbl { margin-right: 2px; }
.pv-ex { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.pv-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 76px; }
@media (max-width: 1200px) { .pv-ex { grid-template-columns: 1fr; } .pv-side { position: static; } }
.pv-stage { height: clamp(440px, calc(100vh - 330px), 760px); cursor: grab; touch-action: none; }
.pv-stage.drag { cursor: grabbing; }
.pv-stage > svg.pv-svg { width: 100%; height: 100%; display: block; }
.pv-stage:focus-visible { box-shadow: 0 0 0 3px var(--volt); }
.pv-hud-z { left: 10px; top: 10px; align-items: center; }
.pv-hud-z .pv-zl { font: 500 11px var(--font-mono); color: var(--stage-ink-2); min-width: 48px; text-align: center; }
.pv-simlbl { position: absolute; right: 10px; top: 10px; display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: var(--r-md); background: rgba(12,18,32,.85); border: 1px solid var(--stage-line); font-size: var(--fs-xs); color: var(--stage-ink); max-width: 60%; }
.pv-legend { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 6px 10px; border-radius: var(--r-md); background: rgba(12,18,32,.85); border: 1px solid var(--stage-line); font-size: 11px; color: var(--stage-ink-2); pointer-events: none; }
.pv-legend i { display: inline-block; width: 14px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
.lg-unid { border: 1.5px dashed var(--err); } .lg-inc { border: 1.5px dotted var(--warn); } .lg-inf { border: 1.5px dashed var(--src-inferred); } .lg-man { border: 1.5px solid var(--src-manual); } .lg-sel { border: 2px solid var(--volt); }
.pv-legend kbd { background: var(--stage-3); color: var(--stage-ink); border-color: var(--stage-line); }
.pv-tip { position: absolute; z-index: 5; pointer-events: none; padding: 6px 9px; border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-size: var(--fs-xs); box-shadow: var(--shadow-2); max-width: 280px; }
.pv-tip strong { display: block; font-size: var(--fs-sm); }
/* dibujo */
.pv-svg text { font-family: var(--font-mono); font-size: 10px; fill: var(--stage-ink-2); }
.pv-svg .t-name { font: 600 22px var(--font-display); fill: var(--stage-ink); }
.pv-svg .t-title { font-size: 11px; fill: var(--stage-ink-2); letter-spacing: .04em; }
.pv-svg .t-small { font-size: 9px; }
.pv-svg .w { stroke: var(--stage-ink-2); stroke-width: 1.1; fill: none; }
.pv-svg .bus { stroke: var(--stage-ink); stroke-width: 2.4; fill: none; }
.pv-svg .frame { stroke: var(--stage-ink-2); stroke-width: 1; stroke-dasharray: 7 5; fill: none; opacity: .75; }
.pv-svg .node { fill: var(--stage); stroke: var(--stage-ink-2); stroke-width: 1.1; }
.pv-svg .g { stroke: var(--stage-ink); stroke-width: 1.5; fill: none; stroke-linecap: round; }
.pv-svg .g .fill { fill: var(--stage); }
.pv-svg .g text { fill: var(--stage-ink); stroke: none; font-size: 11px; font-weight: 600; }
.pv-svg .g .dash { stroke-dasharray: 3 3; }
.pv-svg .sym { cursor: pointer; outline: none; }
.pv-svg .sym .hit { fill: transparent; }
.pv-svg .sym .ring { fill: none; stroke: transparent; stroke-width: 1.5; rx: 4; }
.pv-svg .sym text.spec { fill: var(--stage-ink); }
.pv-svg .sym text.tag { fill: var(--stage-ink-2); font-size: 9px; }
.pv-svg .sym:hover .hit { fill: rgba(230,235,245,.05); }
.pv-svg .sym:hover .ring { stroke: var(--stage-ink-2); }
.pv-svg .sym:focus-visible .ring { stroke: var(--stage-ink); stroke-width: 2; stroke-dasharray: 4 3; }
.pv-svg .s-unid .g { stroke: var(--err); } .pv-svg .s-unid .g text { fill: var(--stage-ink); font-size: 18px; }
.pv-svg .s-unid .unk { fill: rgba(194,54,43,.14); stroke-dasharray: 4 3; }
.pv-svg .s-unid .ulbl { fill: var(--stage-ink); font-size: 10px; }
.pv-svg .s-unid .upill { fill: var(--err); }
.pv-svg .s-inc text.spec { fill: var(--volt); }
.pv-svg .s-inc .mark { fill: var(--warn); } .pv-svg .mark-t { fill: var(--stage) !important; font: 700 9px var(--font-mono) !important; }
.pv-svg .s-inf .g { stroke: var(--src-inferred); stroke-dasharray: 3 2; }
.pv-svg .res .rbox { fill: none; stroke: var(--src-manual); stroke-width: 1.5; }
.pv-svg .sym.on .ring, .pv-svg .sym.hl .ring { stroke: var(--volt); stroke-width: 2.5; stroke-dasharray: none; animation: ringIn var(--t-slow) var(--ease-out); }
.pv-svg .sym.on .g, .pv-svg .sym.hl .g { stroke: var(--volt); }
.pv-svg .sym.on text.spec, .pv-svg .sym.hl text.spec { fill: var(--volt); }
.pv-svg .sym.dim { opacity: .16; }
@keyframes ringIn { from { stroke-width: 8; opacity: 0; } }
/* panel */
.pv-card .card-h { flex-wrap: wrap; }
.pv-dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; margin: 0; font-size: var(--fs-sm); }
.pv-dl dt { color: var(--ink-3); } .pv-dl dd { margin: 0; }
.pv-qty { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.pv-qty div { padding: 8px 10px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.pv-qty strong { display: block; font: 600 var(--fs-lg)/1.2 var(--font-display); } .pv-qty small { color: var(--ink-3); }
.pv-step { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-md); background: var(--volt-soft); margin: 10px 0; }
.pv-step span { flex: 1; font-size: var(--fs-sm); font-weight: 600; }
.pv-ulist { display: flex; flex-direction: column; }
.pv-ui { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.pv-ui:last-child { border-bottom: 0; } .pv-ui.on { background: var(--volt-soft); box-shadow: inset 3px 0 0 var(--volt); }
.pv-ui small { display: block; color: var(--ink-3); } .pv-ui .row { gap: 4px; flex-wrap: nowrap; }
.pv-bulk { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: var(--fs-xs); }
.req { font: 600 9.5px var(--font-mono); text-transform: uppercase; color: var(--brand); margin-left: 4px; letter-spacing: .04em; }
/* diálogo resolver */
.pv-res { display: flex; flex-direction: column; gap: 12px; }
.pv-res .seg { align-self: flex-start; }
.pv-lines { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; padding: 2px; }
.pv-li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-sm); }
.pv-li:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.pv-li small { display: block; color: var(--ink-3); font-size: var(--fs-xs); }
.pv-li input { accent-color: var(--brand); }
/* guiada */
.pv-g { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(340px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1200px) { .pv-g { grid-template-columns: 1fr; } }
.pv-crop { height: 440px; }
.pv-crop > svg.pv-svg { width: 100%; height: 100%; display: block; }
.pv-crop-lbl { left: 10px; bottom: 10px; padding: 6px 10px; font: 500 11px var(--font-mono); color: var(--stage-ink-2); }
.pv-q { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.pv-q button[aria-current='true'] { background: var(--volt); border-color: var(--volt); color: var(--stage); }
.pv-g-card h3 { margin-bottom: 6px; }
.pv-g-card:focus { outline: none; }
.pv-cands { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.pv-cands button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-sm); }
.pv-cands button:hover { background: var(--surface-2); border-color: var(--line-strong); }
.pv-cands button:focus-visible { box-shadow: var(--focus); }
.pv-cands small { color: var(--ink-3); font-size: var(--fs-xs); }
.pv-conf { display: flex; align-items: center; gap: 8px; margin-top: 6px; } .pv-conf .meter { flex: 1; max-width: 180px; }
.pv-keys { display: flex; gap: 10px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ink-3); }
.pv-prog { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: var(--fs-xs); color: var(--ink-3); } .pv-prog .meter { flex: 1; }
/* tabla */
.pv-tbl td .row { flex-wrap: nowrap; gap: 4px; }
.pv-tbl tr.unid td:first-child { box-shadow: inset 3px 0 0 var(--err); }
/* comentarios, estados */
.pv-com { margin-top: 16px; }
.pv-com-i { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); } .pv-com-i:last-child { border-bottom: 0; }
.pv-com-i small { color: var(--ink-3); display: block; }
.pv-skel { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
.pv-state { max-width: 720px; }
h3[tabindex='-1']:focus { outline: none; box-shadow: none; }
.empty .btn .ic { color: inherit; margin: 0; }
.btn-primary kbd { background: rgba(255,255,255,.18); color: inherit; border-color: rgba(255,255,255,.35); }
.pv-tbl td, .pv-tbl th { padding-left: 10px; padding-right: 10px; }
.pv-tbl td .row { flex-wrap: wrap; }
</style>
</head>
<body data-role="ENGINEER" data-active="plano" data-title="Revisión en plano" data-sub="Lo que el detector leyó en cada tablero, y los símbolos por decidir">
<div id="act"></div>
<div id="page">
  <div id="pv-head"></div>
  <div class="pv-bar"><div id="pv-var"></div><div class="pv-blk" id="pv-blk" aria-live="polite"></div></div>
  <div id="pv-view"></div>
  <div id="pv-com"></div>
</div>
<script>
L.ready(() => {
  const S = () => L.store.get();
  const $ = (sel, root = document) => root.querySelector(sel);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PRE = { itm: 'Q', mccb: 'Q', sec: 'S', dif: 'DD', dps: 'F', cont: 'K', gm: 'QM', multi: 'IM', piloto: 'H', gab: 'U', borne: 'X' };
  const POL = { '1P': '1x', '1P+N': '2x', '2P': '2x', '3P': '3x', '4P': '4x' };
  const STAT = { unid: ['Sin identificar', 'err'], inc: ['Lectura incompleta', 'warn'], det: ['Detectado', 'info'], inf: ['Inferido', 'muted'], man: ['Manual', 'ok'] };
  const STATUS_FILTERS = [['all', 'Todos'], ['unid', 'Sin identificar'], ['inc', 'Lectura incompleta'], ['det', 'Detectados'], ['inf', 'Inferidos'], ['man', 'Manuales']];
  const estado = L.param('estado');
  const ST = { planId: null, variant: 'experto', sel: null, fam: L.pref('plano:fam') || [], status: L.pref('plano:status') || 'all', vb: null, checked: new Set(), qi: 0, sort: { key: 'tag', dir: 1 }, draft: '', M: null, focusKey: null };

  /* ───── plano elegido ───── */
  function pickPlan() {
    const qp = L.param('plan'); const qpl = qp && L.plan(qp);
    if (qpl && !qpl.deleted) return qp;
    const pid = L.currentProjectId(); const plans = L.plansOf(pid);
    const ln = L.param('linea'); const line = ln && L.line(ln);
    if (line && line.projectId === pid) { const p = plans.find(x => (line.perPlan || {})[x.id] > 0); if (p) return p.id; }
    const pend = plans.find(p => S().unidentified.some(u => u.planId === p.id && u.status === 'PENDIENTE'));
    if (pend) return pend.id;
    const done = plans.find(p => p.status === 'COMPLETED');
    return done ? done.id : (plans[0] ? plans[0].id : null);
  }
  const pendingIn = planId => S().unidentified.filter(u => u.planId === planId && u.status === 'PENDIENTE');

  /* ───── texto técnico estilo CAD ───── */
  function specOf(typeId, a) {
    a = a || {}; const q = v => v == null || v === '' ? '?' : v;
    switch (typeId) {
      case 'itm': return [(POL[a.polos] || '?') + q(a.in) + 'A', 'Curva ' + q(a.curva)];
      case 'mccb': return [(POL[a.polos] || '?') + q(a.in) + 'A', q(a.icu) + 'kA'];
      case 'sec': return [(POL[a.polos] || '?') + q(a.in) + 'A', 'SECC.'];
      case 'dif': return [(POL[a.polos] || '?') + q(a.in) + 'A', q(a.sens) + 'mA'];
      case 'dps': return ['DPS ' + (a.polos || '?'), q(a.imax) + 'kA'];
      case 'cont': return [q(a.in) + 'A AC3', String(q(a.bobina))];
      case 'gm': return [String(q(a.rango)), 'GM'];
      case 'multi': return ['MULTIMEDIDOR', a.com || ''];
      case 'piloto': return [String(a.color || '?').slice(0, 1).toUpperCase(), q(a.tension)];
      case 'gab': return ['GABINETE ' + q(a.ip), q(a.medida) + ' mm'];
      case 'borne': return [q(a.seccion) + 'mm²'];
    }
    return ['?'];
  }
  const guessLabel = u => u.guess ? L.type(u.guess).short + ' ' + L.attrText(u.guess, u.guessAttrs || {}) : 'Sin sugerencia';

  /* ───── modelo: símbolos + layout determinista ───── */
  function model(plan) {
    const s = S(); const pid = plan.projectId;
    const lines = L.linesOf(pid).filter(l => (l.perPlan || {})[plan.id] > 0);
    const unids = s.unidentified.filter(u => u.planId === plan.id);
    const res = unids.filter(u => u.status === 'RESUELTO' && u.lineId);
    const statusOf = l => L.missingAttrs(l).length ? 'inc' : l.src === 'RULE' ? 'inf' : l.src === 'MANUAL' ? 'man' : 'det';
    const syms = [];
    lines.forEach(l => {
      const t = L.type(l.typeId); const mine = res.filter(u => u.lineId === l.id);
      const n = Math.max(0, l.perPlan[plan.id] - mine.length);
      for (let k = 0; k < n; k++) syms.push({ id: l.id + ':' + k, kind: 'tree', line: l, typeId: l.typeId, fam: t ? t.family : 'Otros', spec: specOf(l.typeId, l.attrs), status: statusOf(l) });
      mine.forEach(u => syms.push({ id: 'r:' + u.id, kind: 'res', line: l, u, typeId: l.typeId, fam: t ? t.family : 'Otros', spec: specOf(l.typeId, l.attrs), status: L.missingAttrs(l).length ? 'inc' : 'man' }));
    });
    const cnt = {}; syms.forEach(x => { const p = PRE[x.typeId] || 'E'; cnt[p] = (cnt[p] || 0) + 1; x.tag = p + cnt[p]; });
    unids.filter(u => u.status === 'PENDIENTE').forEach(u => syms.push({ id: 'u:' + u.id, kind: 'unid', u, typeId: null, fam: u.guess ? L.type(u.guess).family : 'Sin identificar', spec: [u.text], status: 'unid', tag: '?' }));

    const tree = syms.filter(x => x.kind === 'tree'); const of = f => tree.filter(f);
    const big4 = x => x.typeId === 'itm' && /^[34]P/.test(x.line.attrs.polos || '');
    const heads = of(x => x.typeId === 'mccb' || x.typeId === 'sec');
    const pilots = of(x => x.typeId === 'piloto'), multis = of(x => x.typeId === 'multi'), dpss = of(x => x.typeId === 'dps');
    const gabs = of(x => x.typeId === 'gab'), bornes = of(x => x.typeId === 'borne');
    const big = of(big4), small = of(x => x.typeId === 'itm' && !big4(x)), difs = of(x => x.typeId === 'dif');
    const used = new Set([].concat(heads, pilots, multis, dpss, gabs, bornes, big, small, difs));
    const rest = tree.filter(x => !used.has(x));
    const branches = big.map(x => ({ top: x, kids: [] }));
    if (difs.length) { let i = 0; difs.forEach((d, di) => { const k = Math.floor(small.length / difs.length) + (di < small.length % difs.length ? 1 : 0); branches.push({ top: d, kids: small.slice(i, i + k) }); i += k; }); }
    else small.forEach(x => branches.push({ top: x, kids: [] }));
    rest.forEach(x => branches.push({ top: x, kids: [] }));
    const cols = branches.reduce((a, b) => a + Math.max(1, b.kids.length), 0);
    const dense = cols > 14; const CW = dense ? 48 : 70; const bw = cols * CW;
    const W = Math.max(1000, bw + 320);
    const BS = 17; const perRow = Math.max(1, Math.floor((W - 300) / BS)); const bRows = Math.max(1, Math.ceil(bornes.length / perRow));
    const H = 790 + (bRows - 1) * 22;
    const Y = { pil: 140, side: 300, bus: 340, d1: 412, sub: 480, d2: 548, out: 612, born: 712 };
    const fx = W / 2; let d = ''; let nodes = ''; let txt = '';
    const seg = (x1, y1, x2, y2) => { d += `M${x1} ${y1}L${x2} ${y2}`; };
    const node = (x, y) => { nodes += `<circle class="node" cx="${x}" cy="${y}" r="2.8"/>`; };
    const text = (x, y, s, cls, extra) => { txt += `<text x="${x}" y="${y}"${cls ? ` class="${cls}"` : ''}${extra || ''}>${L.esc(s)}</text>`; };

    // acometida
    txt += `<path class="w" d="M${fx - 5} 22L${fx} 12L${fx + 5} 22"/>`;
    txt += `<text class="t-small" transform="translate(${fx - 9} 60) rotate(-90)">${plan.name === 'TGBT' ? 'ACOMETIDA' : 'DESDE TGBT'}</text>`;
    const hy = heads.length === 1 ? [220] : heads.length === 2 ? [190, 258] : heads.map((_, i) => Math.round(176 + i * (150 / heads.length)));
    let yPrev = 12; heads.forEach((h, i) => { h.x = fx; h.y = hy[i]; h.place = 'right'; seg(fx, yPrev, fx, h.y - 26); yPrev = h.y + 26; });
    seg(fx, yPrev, fx, Y.bus); node(fx, Y.bus);
    if (pilots.length) {
      pilots.forEach((p, i) => { p.x = fx - 70 - i * 30; p.y = Y.pil; p.place = 'below'; });
      seg(fx, Y.pil, pilots[pilots.length - 1].x, Y.pil); node(fx, Y.pil);
      text((fx - 70 + pilots[pilots.length - 1].x) / 2, Y.pil + 38, 'INDICACIÓN LUMINOSA', 't-small', ' text-anchor="middle"');
    }
    if (multis.length) { multis.forEach((m, i) => { m.x = fx - 120 - i * 60; m.y = Y.side; m.place = 'left'; }); seg(fx, Y.side, multis[multis.length - 1].x, Y.side); node(fx, Y.side); }
    if (dpss.length) {
      dpss.forEach((m, i) => { m.x = fx + 150 + i * 60; m.y = Y.side; m.place = 'above'; });
      const last = dpss[dpss.length - 1].x + 30; seg(fx, Y.side, last, Y.side); node(fx, Y.side);
      txt += `<path class="w" d="M${last} ${Y.side - 8}V${Y.side + 8}M${last + 4} ${Y.side - 5}V${Y.side + 5}M${last + 8} ${Y.side - 2}V${Y.side + 2}"/>`;
    }
    // juego de barras y ramas
    const x0 = (W - bw) / 2; const busA = Math.min(x0 + CW / 2 - 16, fx - 170), busB = Math.max(x0 + bw - CW / 2 + 16, fx + 170);
    txt += `<path class="bus" d="M${busA} ${Y.bus}H${busB}"/>`;
    text(busA, Y.bus - 9, 'JUEGO DE BARRAS 3x380/220 VCA', 't-small');
    let cx = x0, circ = 0;
    const dest = x => { circ++; txt += `<text class="t-small" text-anchor="end" transform="translate(${x + 3} ${Y.out + 8}) rotate(-90)">C${circ}</text>`; };
    branches.forEach(b => {
      const n = Math.max(1, b.kids.length); const bx = cx + n * CW / 2;
      b.top.x = bx; b.top.y = Y.d1; b.top.place = dense ? 'rot' : 'right';
      seg(bx, Y.bus, bx, Y.d1 - 26); node(bx, Y.bus);
      if (b.kids.length) {
        seg(bx, Y.d1 + 26, bx, Y.sub);
        if (n > 1) seg(cx + CW / 2, Y.sub, cx + (n - .5) * CW, Y.sub);
        b.kids.forEach((k, i) => { const kx = cx + (i + .5) * CW; k.x = kx; k.y = Y.d2; k.place = dense ? 'rot' : 'right'; seg(kx, Y.sub, kx, Y.d2 - 26); node(kx, Y.sub); seg(kx, Y.d2 + 26, kx, Y.out); dest(kx); });

      text(bx0 - 12, Y.born + 4, 'BORNERA DE SALIDA', 't-small', ' text-anchor="end"');
      for (let r = 0; r < bRows; r++) seg(bx0, Y.born + r * 22, bx0 + Math.min(rowW, (bornes.length - r * perRow) * BS), Y.born + r * 22);
      bornes.forEach((b, i) => { b.x = bx0 + (i % perRow) * BS + BS / 2; b.y = Y.born + Math.floor(i / perRow) * 22; b.place = 'none'; });
    }
    gabs.forEach((g, i) => { g.x = W - 70 - i * 40; g.y = 104; g.place = 'left'; });
    // símbolos posicionados por su caja de detección (x/y normalizados sobre el marco)
    const fw = W - 60, fh = H - 90;

    const frame = `<rect class="frame" x="30" y="66" width="${W - 60}" height="${H - 90}" rx="2"/>`;
    const title = `<text class="t-name" x="52" y="102">${L.esc(plan.name)}</text><text class="t-title" x="52" y="122">${L.esc(plan.title.toUpperCase())}</text>`;

  /* ───── glifos IEC-like, centrados en (0,0), de -26 a 26 en vertical ───── */
  function ticks(polos) { const n = { '1P': 1, '1P+N': 2, '2P': 2, '3P': 3, '4P': 4 }[polos] || 0; let s = ''; for (let i = 0; i < n; i++) { const y = -21 + i * 3 - (n - 1) * 1.5; s += `M-4 ${y + 3}L4 ${y - 3}`; } return s ? `<path d="${s}"/>` : ''; }
  const X = 'M-3-15L3-9M3-15L-3-9';
  function glyph(t, polos) {
    switch (t) {

      case 'mccb': return `<rect class="dash" x="-18" y="-18" width="32" height="36" rx="2"/><path d="M0-26V-12${X}M0 12L-11-10M0 12V15q5 2.5 0 5V26"/>` + ticks(polos);
      case 'sec': return `<path d="M0-26V-12M-5-12H5M0 12L-11-10M0 12V26"/>` + ticks(polos);
      case 'dif': return `<path d="M0-26V-12${X}M0 12L-11-10M0 12V26M-8 18H-16V-2H-9"/><ellipse class="fill" cx="0" cy="18" rx="8" ry="4"/>` + ticks(polos);
      case 'cont': return `<path d="M0-26V-12M-4-12A4 4 0 0 0 4-12M0 12L-11-10M0 12V26M-30 7L-18-7"/><path class="dash" d="M-18 0H-8"/><rect class="fill" x="-30" y="-7" width="12" height="14"/><path d="M-30 7L-18-7"/>`;
      case 'gm': return `<path d="M0-26V-12${X}M0 12L-11-10M0 12V26"/><rect class="fill" x="-30" y="-6" width="15" height="12"/><text x="-22.5" y="3" text-anchor="middle" style="font-size:8px">I&gt;</text>`;
      case 'multi': return `<rect class="fill" x="-17" y="-13" width="34" height="26"/><text x="0" y="4" text-anchor="middle">IM</text>`;
      case 'piloto': return `<circle class="fill" r="9"/><path d="M-6.4-6.4L6.4 6.4M6.4-6.4L-6.4 6.4"/>`;
      case 'dps': return `<rect class="fill" x="-9" y="-11" width="18" height="22"/><path d="M0-7V5M-3 2L0 6L3 2"/>`;
      case 'borne': return `<circle class="fill" r="4"/>`;

  }
  const tw = arr => Math.max(...arr.map(s => String(s).length)) * 6.1;
  function symSvg(x, opts) {

    if (x.kind === 'unid') {

      g = `<rect class="unk" x="-16" y="-22" width="32" height="44" rx="3"/><text x="0" y="7" text-anchor="middle">?</text>`;
      t = `<rect class="upill" x="${-lw / 2}" y="-42" width="${lw}" height="16" rx="8"/><text class="ulbl" x="0" y="-30.5" text-anchor="middle">${L.esc(x.spec[0])}</text>`;
      hit = [-Math.max(20, lw / 2) - 2, -44, Math.max(40, lw) + 4, 70];
    } else {
      g = glyph(x.typeId, x.line.attrs.polos);
      const w = tw(x.spec);
      if (x.place === 'right') { const sx = x.typeId === 'mccb' ? 19 : 12; t = `<text class="spec" x="${sx}" y="-4">${L.esc(x.spec[0])}</text>` + (x.spec[1] ? `<text class="spec" x="${sx}" y="8">${L.esc(x.spec[1])}</text>` : '') + `<text class="tag" x="${sx}" y="21">${x.tag}</text>`; hit = [-16, -30, sx + 4 + w, 60]; }
      else if (x.place === 'rot') { t = `<g transform="rotate(-90)"><text class="spec" x="-24" y="15">${L.esc(x.spec[0])}</text>` + (x.spec[1] ? `<text class="spec" x="-24" y="26">${L.esc(x.spec[1])}</text>` : '') + '</g>'; const top = Math.min(-30, 24 - w - 4); hit = [-18, top, 50, 30 - top]; }
      else if (x.place === 'left') { t = `<text class="spec" x="-${x.typeId === 'gab' ? 18 : 24}" y="-2" text-anchor="end">${L.esc(x.spec[0])}</text>` + (x.spec[1] ? `<text class="spec" x="-${x.typeId === 'gab' ? 18 : 24}" y="11" text-anchor="end">${L.esc(x.spec[1])}</text>` : ''); hit = [-28 - w, -18, 48 + w, 36]; }
      else if (x.place === 'above') { t = `<text class="spec" x="0" y="-27" text-anchor="middle">${L.esc(x.spec[0])}</text><text class="spec" x="0" y="-16" text-anchor="middle">${L.esc(x.spec[1] || '')}</text>`; hit = [-w / 2 - 4, -38, w + 8, 52]; }
      else if (x.place === 'below') { t = `<text class="spec" x="0" y="23" text-anchor="middle">${L.esc(x.spec[0])}</text>`; hit = [-13, -13, 26, 40]; }

    const a = opts.interactive ? ` tabindex="${dim ? -1 : 0}" role="button" aria-pressed="${on}" aria-label="${L.esc(ariaOf(x))}" data-sym="${x.id}" data-fk="sym:${x.id}"` : '';
    return `<g class="${cls}" transform="translate(${x.x} ${x.y})"${a}><rect class="hit" x="${hit[0]}" y="${hit[1]}" width="${hit[2]}" height="${hit[3]}"/>${ring}<g class="g">${g}</g>${t}</g>`;

  function ariaOf(x) {

    return `<svg class="pv-svg" ${opts.id ? `id="${opts.id}"` : ''} viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" preserveAspectRatio="xMidYMid meet" ${opts.interactive ? `role="group" aria-label="Vista esquemática de ${L.esc(M.plan.name)}: ${M.syms.length} símbolos"` : 'aria-hidden="true" focusable="false"'}>${M.back}${syms.map(x => symSvg(x, opts)).join('')}</svg>`;
  }
  const passes = x => (!ST.fam.length || ST.fam.includes(x.fam)) && (ST.status === 'all' || x.status === ST.status);

  /* ───── candidatos para resolver ───── */
  function candidates(pid, u, planId) {
    return L.linesOf(pid).map((l, i) => {

      return { line: l, score: sc, i, here: (l.perPlan || {})[planId] || 0 };
    }).sort((a, b) => b.score - a.score || a.i - b.i);
  }

  /* ───── acciones de dominio ───── */
  function resolveTo(uids, how) {
    const before = S().bomLines.length;
    uids.forEach(id => L.resolveSymbol(id, how));
    const u = S().unidentified.find(x => x.id === uids[0]); const l = L.line(u.lineId); const pl = L.plan(u.planId);
    const created = S().bomLines.length > before;

    if (created) L.toast('Línea creada y ' + n.toLowerCase() + ' a «' + L.lineLabel(l) + '»', { detail: 'Queda sin marca decidida: decidila en el BOM antes de cotizar.', action: { label: 'Abrir en el BOM', onClick: () => { location.href = L.link('d-bom.html', { p: pl.projectId, linea: l.id }); } } });
    else L.toast(n + ' a «' + L.lineLabel(l) + '»', { detail: pl.name + ': ahora cuenta ' + l.perPlan[pl.id] + ' dibujados en esta línea.' });

  }

  }
  async function toggleReviewed() {

  /* ───── diálogo resolver (asignar a línea existente o crear línea nueva) ───── */

      ${one && one.guess ? `<div class="note note-ai">${L.icon('sparkles', 16)}<p>${L.ai('Sugerencia')} <strong>${L.esc(guessLabel(one))}</strong> · confianza ${L.pct(one.conf * 100)}. La calculó la detección, no suma costo de IA. Confirmala vos.</p></div>` : ''}
      <div class="seg" role="tablist" aria-label="Cómo resolver"><button type="button" role="tab" id="pv-tab-exist" aria-controls="pv-pane-exist" data-m="exist">Asignar a una línea existente</button><button type="button" role="tab" id="pv-tab-new" aria-controls="pv-pane-new" data-m="new">Crear línea nueva</button></div>
      <div id="pv-pane-exist" role="tabpanel" aria-labelledby="pv-tab-exist"><div class="field"><span class="lbl" id="pv-lines-lbl">Línea del BOM de ${L.esc(pr.name)}</span>

        <div class="field"><label for="pv-type">Componente base <span class="req">esencial</span></label><select class="select" id="pv-type"><option value="">Elegí un componente base</option>${Object.entries(types).map(([id, t]) => `<option value="${id}"${one && one.guess === id ? ' selected' : ''}>${L.esc(t.name)}</option>`).join('')}</select><span class="hint">Lista cerrada del catálogo canónico. Los atributos esenciales definen con qué ítems de catálogo se compara.</span></div>

    body.querySelectorAll('[data-m]').forEach(b => { b.onclick = () => setMode(b.dataset.m); b.onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const o = body.querySelector(`[data-m]:not([data-m="${b.dataset.m}"])`); setMode(o.dataset.m); o.focus(); } }; });

  /* ───── encabezado, bloqueos, acciones ───── */
  function renderHead(plan, M) {

  }
  function renderBlockers(pid) {
    const b = L.blockers(pid); const un = L.unidentifiedOf(pid).length;

  /* ───── variante b: revisión una por una ───── */
  function queueOf(M) {

    return q;
  }
  function renderGuided(host, M) {

      const r = $('#pv-g-rev'); if (r) r.onclick = toggleReviewed; $('#pv-g-see').onclick = () => document.querySelector('#pv-var [data-v="experto"]').click();

    }
    ST.qi = Math.max(0, Math.min(ST.qi, q.length - 1)); const it = q[ST.qi]; const x = it.sym;

        ${u.guess ? `<div class="note note-ai">${L.icon('sparkles', 16)}<div style="flex:1"><p>${L.ai('Sugerencia')} <strong>${L.esc(guessLabel(u))}</strong></p><div class="pv-conf"><div class="meter warn"><i style="width:${Math.round(u.conf * 100)}%"></i></div><small>confianza ${L.pct(u.conf * 100)}</small></div><p style="margin-top:6px;font-size:var(--fs-xs)">${exact ? 'Al aceptarla se suma a la línea existente «' + L.esc(L.lineLabel(exact.line)) + '».' : 'Al aceptarla se crea una línea nueva, manual y sin marca.'} La calculó la detección: no suma costo de IA.</p>

        <p class="lbl" style="margin:14px 0 0">O asignalo a una línea de la obra</p><ol class="pv-cands">${cands.map((c, i) => `<li><button data-pick="${i + 1}" data-fk="pick:${i + 1}"><kbd>${i + 1}</kbd><span>${L.esc(L.lineLabel(c.line))}<small> · ${c.here ? 'en este plano: ' + c.here : 'no está en este plano'}</small></span>${L.srcTag(c.line.src)}</button></li>`).join('')}</ol>

        ${miss.map(a => `<div class="field" style="margin-top:10px"><label for="pv-g-miss-${a.k}">${L.esc(a.label)}<span class="req">esencial</span></label><div class="row" style="flex-wrap:nowrap"><select class="select" id="pv-g-miss-${a.k}" data-fk="gmiss:${a.k}"><option value="">Elegí un valor</option>${a.values.map((v, j) => `<option value="${j}">${v}${a.unit ? ' ' + a.unit : ''}</option>`).join('')}</select><button class="btn btn-primary btn-sm" data-gsave="${a.k}" data-fk="gsave:${a.k}">Guardar atributo</button></div></div>`).join('')}

        <nav class="pv-q" aria-label="Cola de símbolos por decidir">${q.map((y, i) => `<button class="chip" data-qi="${i}" aria-current="${i === ST.qi}" data-fk="qi:${i}">${i + 1} · ${y.kind === 'unid' ? '«' + L.esc(y.u.text) + '»' : L.esc(y.sym.tag) + ' lectura incompleta'}</button>`).join('')}</nav></div>
      <section class="card pv-g-card" aria-live="polite"><div class="card-h"><span class="eyebrow">Símbolo ${ST.qi + 1} de ${q.length} por decidir</span>${L.cap('propuesto')}<span class="spacer"></span><button class="icon-btn" id="pv-g-prev" aria-label="Anterior (←)" title="Anterior (←)" data-fk="gprev">${L.icon('chevl', 16)}</button><button class="icon-btn" id="pv-g-next" aria-label="Siguiente (→)" title="Siguiente (→)" data-fk="gnext">${L.icon('chevr', 16)}</button></div>
        <div class="card-b">${all.length ? `<div class="pv-prog"><span>${done} de ${all.length} sin identificar decididos</span><div class="meter ok" role="progressbar" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${done}" aria-label="Símbolos decididos"><i style="width:${done / all.length * 100}%"></i></div></div>` : ''}${body}</div>
        <div class="card-f"><div class="pv-keys"><span><kbd>A</kbd> aceptar sugerencia</span><span><kbd>D</kbd> descartar</span><span><kbd>1</kbd>–<kbd>9</kbd> asignar a línea</span><span><kbd>N</kbd> línea nueva</span><span><kbd>←</kbd><kbd>→</kbd> mover</span></div><span class="spacer"></span>${q.some(y => y.kind === 'unid') ? `<button class="btn btn-ghost btn-sm" id="pv-g-disall" data-fk="gdisall">Descartar todos…</button>` : ''}</div></section></div>`;
    $('#pv-g-prev').onclick = () => gMove(-1); $('#pv-g-next').onclick = () => gMove(1);

    host.querySelectorAll('[data-gsave]').forEach(b => b.onclick = () => { const sel = $('#pv-g-miss-' + b.dataset.gsave); if (sel.value === '') { L.fieldError(sel, 'Elegí un valor.'); sel.focus(); return; } ST.focusKey = 'g-title'; saveAttr(it.line, b.dataset.gsave, sel.value); });

  /* ───── variante c: tabla accesible ───── */

        <td class="mono">${L.esc(r.tag)}</td><td>${L.esc(r.comp)}<small class="muted" style="display:block">${L.esc(r.fam)}</small></td><td class="mono">${L.esc(r.spec)}</td><td>${r.line ? L.esc(r.line) : x.u.guess ? '<span class="muted">Sugerencia: ' + L.esc(guessLabel(x.u)) + '</span> ' + L.ai() : '<span class="muted">—</span>'}</td>

        : `<tr><td colspan="8">${L.empty({ icon: 'filter', title: 'Ningún símbolo con estos filtros', text: 'El plano tiene ' + M.syms.length + ' símbolos. Probá con otra familia o estado.', action: '<button class="btn btn-secondary btn-sm" id="pv-clear" data-fk="clear">Quitar filtros</button>' })}</td></tr>`}</tbody></table></div></section>`;

  /* ───── estados ───── */
  function renderLoading() {

  }
  function renderNotReady(host, plan) {

        <div class="row"><a class="btn btn-primary" href="${L.link('d-obra.html', { p: plan.projectId, plan: plan.id })}">${L.icon('refresh', 15)}Volver a procesar en Planos</a><a class="btn btn-ghost" href="${L.link('d-obra.html', { p: plan.projectId })}">Recortar el plano en partes</a></div>
        <p class="muted" style="margin:0;font-size:var(--fs-xs)">Un 504 de detección no se reintenta automáticamente: cada intento es una detección paga.</p></div></section>`;

  /* ───── render ───── */
  function renderView() {
    const plan = L.plan(ST.planId); const host = $('#pv-view');
    const ae = document.activeElement; const fk = ST.focusKey || (ae && ae.closest && ae.closest('#page') && ae.dataset && ae.dataset.fk); ST.focusKey = null;
    if (!plan) { host.innerHTML = `<section class="card">${L.empty({ icon: 'layers', title: 'Esta obra no tiene planos', text: 'Subí los planos de los tableros y procesalos: después revisás acá lo que leyó el detector.', action: `<a class="btn btn-primary" href="${L.link('d-obra.html')}">Subir planos</a>` })}</section>`; return; }
    if (plan.status !== 'COMPLETED' || estado === 'error') { ST.M = null; renderNotReady(host, plan); return; }

    // la selección sigue al símbolo aunque cambie de estado
    if (ST.sel && ST.sel.startsWith('u:') && !M.syms.find(x => x.id === ST.sel)) { const u = S().unidentified.find(y => 'u:' + y.id === ST.sel); ST.sel = u && u.status === 'RESUELTO' ? 'r:' + u.id : null; }
    if (ST.sel && !M.syms.find(x => x.id === ST.sel)) ST.sel = null;

    if (ST.variant === 'guiada') renderGuided(host, M); else if (ST.variant === 'tabla') renderTable(host, M); else renderExpert(host, M);
    if (fk) { const el = document.querySelector(`#page [data-fk="${CSS.escape(fk)}"]`) || (fk.startsWith('sym:') || fk.startsWith('step') ? $('#pv-stage') : null) || (fk === 'g-title' ? $('#pv-g-title, #pv-g-done') : null); if (el) el.focus({ preventScroll: true }); }
  }
  function render() {
    const plan = L.plan(ST.planId);

    renderHead(plan, plan && plan.status === 'COMPLETED' && estado !== 'error' ? ST.M : null);
    renderBlockers(plan ? plan.projectId : L.currentProjectId());
    $('#pv-var').classList.toggle('hidden', !(plan && plan.status === 'COMPLETED' && estado !== 'error'));
    renderView(); renderAct(plan); renderComments(plan);
  }

  /* ───── arranque ───── */
  if (estado === 'cargando') { renderLoading(); return; }
  ST.planId = pickPlan();
  const ln = L.param('linea');
  if (ln && !L.param('v')) L.setParam('v', 'experto');
  let booted = false;
  L.variants($('#pv-var'), [
    { id: 'experto', label: 'Lienzo experto', desc: 'Zoom, filtros, panel de la línea y resolución en lote' },
    { id: 'guiada', label: 'Revisión una por una', desc: 'Cola guiada de lo que necesita una decisión, con atajos de teclado' },
    { id: 'tabla', label: 'Tabla accesible', desc: 'Todos los símbolos en una tabla ordenable, con las mismas acciones' },
  ], v => { ST.variant = v; if (!booted) return; if (ST.pendingSel) { ST.sel = ST.pendingSel; ST.pendingSel = null; render(); requestAnimationFrame(() => frameSym(ST.sel)); } else render(); }, 'plano');
  ST.variant = L.param('v') || L.pref('v:plano') || 'experto';
  booted = true;
  const pl = L.plan(ST.planId);
  if (ln && pl && ST.variant === 'experto') { const l = L.line(ln); if (l && (l.perPlan || {})[pl.id] > 0) { const M = model(pl); const first = M.syms.find(x => x.line && x.line.id === ln); if (first) ST.sel = first.id; } }
  if (pl && !L.param('plan')) L.setParam('plan', pl.id);
  render();
  if (ST.sel) requestAnimationFrame(() => frameSym(ST.sel));
  L.store.subscribe(() => render());
});
</script>
</body>
</html>
